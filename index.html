<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>দিকনির্ণয় — ভর্তি প্রস্তুতি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{
  --ink:#1B2430; --ink-soft:#3A4453;
  --parchment:#F7F4EC; --paper:#FFFFFF;
  --brass:#B8892B; --brass-dim:#E7D5A9;
  --teal:#2F6F5E; --clay:#B5533C;
  --line:#E4DFD1;
  --shadow: 0 1px 2px rgba(27,36,48,.06), 0 6px 20px rgba(27,36,48,.05);
  --radius: 14px;
  font-size: 16px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Hind Siliguri','Inter',sans-serif;
  background:var(--parchment); color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,.serif{font-family:'Source Serif 4', serif;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---------- Compass intro ---------- */
#intro{
  position:fixed; inset:0; background:var(--ink); z-index:999;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  transition:opacity .7s ease, visibility .7s ease;
}
#intro.hide{opacity:0; visibility:hidden; pointer-events:none;}
.compass{width:120px; height:120px; position:relative;}
.compass svg{width:100%; height:100%;}
.needle{transform-origin:60px 60px; animation: settle 2.1s cubic-bezier(.22,1,.36,1) forwards;}
@keyframes settle{
  0%{transform:rotate(390deg); opacity:0;}
  35%{opacity:1;}
  60%{transform:rotate(-18deg);}
  80%{transform:rotate(6deg);}
  100%{transform:rotate(0deg);}
}
.intro-word{color:var(--brass-dim); font-family:'Source Serif 4',serif; font-size:1.05rem; letter-spacing:.04em; margin-top:22px; opacity:0; animation:fadeUp 1s ease forwards; animation-delay:1.1s;}
@keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* ---------- Login ---------- */
#login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
.login-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:40px 36px; max-width:380px; width:100%; text-align:center;}
.login-mark{width:46px; height:46px; margin:0 auto 18px;}
.login-card h1{font-size:1.5rem; margin-bottom:6px;}
.login-card p{color:var(--ink-soft); font-size:.92rem; margin-bottom:26px; line-height:1.55;}
.g-btn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:13px 16px; border:1px solid var(--line); border-radius:10px; background:var(--paper); font-size:.95rem; font-weight:600; color:var(--ink); transition:border-color .2s, box-shadow .2s;}
.g-btn:hover{border-color:var(--brass); box-shadow:0 2px 10px rgba(184,137,43,.15);}
.login-note{margin-top:16px; font-size:.78rem; color:#9A9384;}

/* ---------- App shell ---------- */
#app{min-height:100vh; display:none;}
#app.show{display:block; animation:fadeIn .5s ease;}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.topbar{position:sticky; top:0; z-index:20; background:rgba(247,244,236,.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:14px 22px; gap:10px; flex-wrap:wrap;}
body.exam-mode .topbar{display:none;}
.brand{display:flex; align-items:center; gap:10px; font-family:'Source Serif 4',serif; font-weight:600; font-size:1.05rem;}
.brand svg{width:26px; height:26px;}
.topbar-right{display:flex; align-items:center; gap:14px; font-size:.85rem; color:var(--ink-soft);}
.back-btn{background:none; border:none; color:var(--ink-soft); font-size:.9rem; display:flex; align-items:center; gap:6px;}
.back-btn:hover{color:var(--brass);}
main{max-width:960px; margin:0 auto; padding:28px 20px 80px;}
body.exam-mode main{padding:0;}
.view-enter{animation:slideUp .4s cubic-bezier(.22,1,.36,1);}
@keyframes slideUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

.section-title{font-size:1.4rem; margin-bottom:4px;}
.section-sub{color:var(--ink-soft); font-size:.9rem; margin-bottom:22px;}
.kbd-hint{display:inline-block; font-size:.72rem; color:var(--ink-soft); background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-family:'Inter',sans-serif; margin-left:4px;}

/* Dashboard */
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:8px;}
@media(max-width:640px){.tiles{grid-template-columns:1fr;}}
.tile{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:26px 22px; box-shadow:var(--shadow); transition:transform .25s ease, box-shadow .25s ease; text-align:left;}
.tile:hover{transform:translateY(-3px); box-shadow:0 10px 26px rgba(27,36,48,.09);}
.tile .icon{width:30px; height:30px; margin-bottom:14px; color:var(--brass);}
.tile h3{font-size:1.08rem; margin-bottom:5px;}
.tile p{color:var(--ink-soft); font-size:.85rem; line-height:1.5;}

/* Cards / tree */
.group-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:14px; box-shadow:var(--shadow); overflow:hidden;}
.group-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; cursor:pointer; gap:8px; flex-wrap:wrap;}
.group-head-left{display:flex; align-items:center; gap:10px;}
.chev{width:16px; height:16px; transition:transform .25s ease; color:var(--ink-soft);}
.group-card.open .chev{transform:rotate(90deg);}
.group-title{font-weight:600; font-size:1rem;}
.group-meta{color:var(--ink-soft); font-size:.78rem;}
.group-body{max-height:0; overflow:hidden; transition:max-height .35s ease;}
.group-card.open .group-body{max-height:8000px;}
.chapter-row{display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--line); flex-wrap:wrap; gap:8px;}
.chapter-row:hover{background:#FBF9F3;}
.chapter-name{font-size:.93rem; font-weight:500;}
.chapter-count{font-size:.78rem; color:var(--ink-soft);}
.row-actions{display:flex; gap:6px; flex-wrap:wrap;}
.icon-btn{width:30px; height:30px; border:none; background:none; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); transition:background .2s,color .2s; flex-shrink:0;}
.icon-btn:hover{background:var(--brass-dim); color:var(--ink);}
.icon-btn svg{width:15px; height:15px;}
.icon-btn.ai-btn{color:var(--brass);}
.icon-btn.ai-btn:hover{background:var(--brass); color:#fff;}
.add-row{padding:10px 18px; border-top:1px solid var(--line);}
.link-btn{background:none; border:none; color:var(--brass); font-weight:600; font-size:.85rem;}
.link-btn:hover{text-decoration:underline;}
.empty-hint{color:var(--ink-soft); font-size:.85rem; padding:24px 4px;}

/* Buttons */
.btn{padding:11px 20px; border-radius:10px; border:1px solid var(--line); background:var(--paper); font-size:.9rem; font-weight:600; color:var(--ink); transition:all .2s;}
.btn:hover{border-color:var(--brass);}
.btn-primary{background:var(--ink); color:#fff; border-color:var(--ink);}
.btn-primary:hover{background:#0f151d;}
.btn-gold{background:var(--brass); color:#fff; border-color:var(--brass);}
.btn-gold:hover{background:#a37820;}
.btn-danger{color:var(--clay); border-color:var(--clay);}
.btn-danger:hover{background:#FBEAE5;}
.btn-block{width:100%;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap;}
.btn[disabled]{opacity:.5; cursor:not-allowed;}

/* Modal */
.overlay{position:fixed; inset:0; background:rgba(27,36,48,.45); display:flex; align-items:center; justify-content:center; z-index:200; padding:16px; opacity:0; visibility:hidden; transition:opacity .25s ease, visibility .25s ease;}
.overlay.show{opacity:1; visibility:visible;}
.modal{background:var(--paper); border-radius:var(--radius); padding:26px; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.25); transform:scale(.96) translateY(6px); transition:transform .25s ease;}
.overlay.show .modal{transform:scale(1) translateY(0);}
.modal h3{margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:.8rem; color:var(--ink-soft); margin-bottom:6px; font-weight:600;}
.field input,.field select,.field textarea{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:.92rem; background:#FDFCF9;}
.field textarea{min-height:70px; resize:vertical;}
.field-row{display:flex; gap:10px;}
.field-row>.field{flex:1;}
.opt-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.opt-row input[type=text]{flex:1;}
.opt-row input[type=radio]{width:18px; height:18px; accent-color:var(--teal); flex-shrink:0;}
.hint{font-size:.76rem; color:#9A9384; margin-top:4px;}

/* Unified AI input box */
.unified-input{border:1.5px solid var(--line); border-radius:16px; background:#FDFCF9; padding:8px; margin-bottom:6px;}
.unified-input:focus-within{border-color:var(--brass);}
.attach-preview{display:flex; align-items:center; gap:8px; padding:6px 8px 10px;}
.attach-preview img{width:52px; height:52px; object-fit:cover; border-radius:8px; border:1px solid var(--line);}
.attach-preview button{background:var(--clay); color:#fff; border:none; width:22px; height:22px; border-radius:50%; font-size:.75rem; line-height:1;}
.input-row{display:flex; align-items:flex-end; gap:6px;}
.input-icon-btn{flex-shrink:0; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--paper); display:flex; align-items:center; justify-content:center; font-size:1.05rem; transition:background .2s, border-color .2s;}
.input-icon-btn:hover{border-color:var(--brass); background:var(--brass-dim);}
.input-icon-btn.recording{background:var(--clay); border-color:var(--clay); color:#fff; animation:pulseRec 1.2s infinite;}
@keyframes pulseRec{0%,100%{opacity:1;}50%{opacity:.6;}}
#ai-raw-text{flex:1; border:none; background:transparent; resize:none; padding:9px 6px; font-size:.94rem; max-height:260px; min-height:38px; line-height:1.4; outline:none;}
.input-send-btn{flex-shrink:0; width:40px; height:40px; border-radius:50%; border:none; background:var(--brass); color:#fff; font-size:1.1rem; display:flex; align-items:center; justify-content:center; transition:background .2s, transform .15s;}
.input-send-btn:hover{background:#a37820; transform:scale(1.05);}
.input-send-btn[disabled]{background:#C9C2AF; cursor:not-allowed; transform:none;}
.api-key-banner{display:flex; align-items:center; justify-content:space-between; gap:10px; background:#FBF3EA; border:1px solid var(--brass-dim); border-radius:10px; padding:10px 14px; font-size:.82rem; margin-bottom:12px; flex-wrap:wrap;}

/* Exam setup */
.preset-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px;}
@media(max-width:640px){.preset-grid{grid-template-columns:repeat(2,1fr);}}
.preset{border:1px solid var(--line); border-radius:12px; padding:16px 12px; text-align:center; background:var(--paper); transition:all .2s;}
.preset.active,.preset:hover{border-color:var(--brass); box-shadow:0 4px 14px rgba(184,137,43,.15);}
.preset .n{font-size:1.3rem; font-weight:700; font-family:'Source Serif 4',serif;}
.preset .t{font-size:.76rem; color:var(--ink-soft);}
.select-check{width:19px; height:19px; accent-color:var(--brass); flex-shrink:0;}

/* Exam runner — sticky header, natural document scroll */
.exam-header-fixed{
  position:sticky; top:0; z-index:50;
  width:100vw; margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw);
}
.exam-top{display:flex; align-items:center; justify-content:space-between; padding:14px 20px; background:var(--paper); border-bottom:1px solid var(--line); gap:10px; flex-wrap:wrap;}
.exam-top-info{font-size:.85rem; color:var(--ink-soft);}
.exam-exit-btn{background:none; border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:.78rem; color:var(--ink-soft);}
.exam-exit-btn:hover{border-color:var(--clay); color:var(--clay);}
.timer{font-family:'Source Serif 4',serif; font-size:1.15rem; font-weight:600; padding:6px 14px; border-radius:8px; background:var(--parchment); border:1px solid var(--line);}
.timer.low{color:var(--clay); border-color:var(--clay); background:#FBEAE5;}
.progress-bar{height:4px; background:var(--line);}
.progress-fill{height:100%; background:var(--brass); transition:width .3s ease;}
.q-wrap{max-width:680px; margin:0 auto; padding:22px 20px calc(140px + env(safe-area-inset-bottom)); cursor:default;}
.q-num{color:var(--ink-soft); font-size:.85rem; margin-bottom:10px;}
.q-stem{font-size:1.08rem; line-height:1.7; margin-bottom:22px;}
.q-hint-dbl{font-size:.72rem; color:#B9B2A0; text-align:center; margin-top:22px;}
.opt{display:flex; align-items:center; gap:14px; padding:14px 16px; border:1.5px solid var(--line); border-radius:12px; margin-bottom:10px; background:var(--paper); transition:border-color .18s, background .18s;}
.opt:hover{border-color:var(--brass-dim);}
.opt.selected{border-color:var(--ink); background:#F1EEE4;}
.opt.locked{cursor:default;}
.opt-key{font-size:.72rem; color:var(--ink-soft); border:1px solid var(--line); border-radius:5px; padding:0 5px; flex-shrink:0;}
.radio-dot{width:20px; height:20px; border-radius:50%; border:2px solid #C9C2AF; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.opt.selected .radio-dot{border-color:var(--ink);}
.radio-dot .fill{width:10px; height:10px; border-radius:50%; background:var(--ink); display:none;}
.opt.selected .radio-dot .fill{display:block;}
.opt-text{font-size:.96rem;}
.exam-nav{position:fixed; bottom:0; left:0; right:0; background:var(--paper); border-top:1px solid var(--line); padding:12px 20px calc(12px + env(safe-area-inset-bottom)); display:flex; justify-content:space-between; gap:10px; z-index:45; flex-wrap:wrap;}

/* Result */
.score-hero{text-align:center; padding:30px 0 10px;}
.score-num{font-family:'Source Serif 4',serif; font-size:3.4rem; font-weight:700; color:var(--ink);}
.score-label{color:var(--ink-soft); font-size:.9rem;}
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:26px 0;}
@media(max-width:640px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px; text-align:center;}
.stat .v{font-size:1.25rem; font-weight:700; font-family:'Source Serif 4',serif;}
.stat .l{font-size:.72rem; color:var(--ink-soft); margin-top:2px;}
.v.correct{color:var(--teal);} .v.wrong{color:var(--clay);}

/* Review */
.review-item{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:12px;}
.review-tag{display:inline-flex; align-items:center; gap:6px; font-size:.76rem; font-weight:700; padding:3px 10px; border-radius:20px; margin-bottom:10px;}
.tag-correct{background:#E4F1EC; color:var(--teal);}
.tag-wrong{background:#FBEAE5; color:var(--clay);}
.tag-skip{background:#EFEAE0; color:var(--ink-soft);}
.review-opt{padding:8px 12px; border-radius:8px; font-size:.88rem; margin-bottom:6px; border:1px solid var(--line);}
.review-opt.is-correct{border-color:var(--teal); background:#F1F8F5;}
.review-opt.is-wrong{border-color:var(--clay); background:#FDF2EF;}
.explain-text{font-size:.95rem; color:var(--ink-soft); line-height:1.7; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);}
.explain-text b{color:var(--ink); font-weight:700;}

/* Performance */
.perf-summary{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px;}
@media(max-width:640px){.perf-summary{grid-template-columns:1fr;}}
.perf-card{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:16px 18px;}
.perf-card .v{font-size:1.4rem; font-weight:700; font-family:'Source Serif 4',serif;}
.perf-card .l{font-size:.78rem; color:var(--ink-soft);}
.up{color:var(--teal);} .down{color:var(--clay);}
.chart-wrap{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:22px;}
.hist-item{display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; background:var(--paper);}
.hist-item .l{font-size:.85rem; color:var(--ink-soft);}
.hist-item .r{font-weight:700; font-family:'Source Serif 4',serif;}
.weak-row{display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-radius:8px; background:#FBF3EA; margin-bottom:6px; font-size:.87rem;}

/* Toast / generating overlay */
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:12px 20px; border-radius:10px; font-size:.87rem; opacity:0; visibility:hidden; transition:all .3s ease; z-index:300; max-width:90vw; text-align:center;}
.toast.show{opacity:1; visibility:visible; transform:translateX(-50%) translateY(0);}
.watermark{position:fixed; inset:0; pointer-events:none; z-index:1; opacity:.035; display:flex; align-items:center; justify-content:center; font-size:3rem; font-family:'Source Serif 4',serif; transform:rotate(-25deg); user-select:none;}
#gen-overlay{position:fixed; inset:0; background:rgba(27,36,48,.82); z-index:500; display:none; align-items:center; justify-content:center; flex-direction:column; color:#fff; gap:16px; text-align:center; padding:24px;}
#gen-overlay .spinner{width:46px; height:46px; border:4px solid rgba(255,255,255,.22); border-top-color:var(--brass); border-radius:50%; animation:spin .8s linear infinite;}
#gen-overlay-text{font-family:'Source Serif 4',serif; font-size:1.08rem; max-width:320px;}
.katex{font-size:1.02em;}
::selection{background:var(--brass-dim);}
</style>
</head>
<body>

<div id="intro">
  <div class="compass">
    <svg viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="52" fill="none" stroke="#E7D5A9" stroke-width="1.4" opacity=".5"/>
      <circle cx="60" cy="60" r="38" fill="none" stroke="#E7D5A9" stroke-width="1" opacity=".35"/>
      <g class="needle">
        <polygon points="60,20 67,60 60,68 53,60" fill="#B8892B"/>
        <polygon points="60,100 67,60 60,52 53,60" fill="#5b4a2c"/>
      </g>
      <circle cx="60" cy="60" r="4" fill="#F7F4EC"/>
    </svg>
  </div>
  <div class="intro-word">দিকনির্ণয়</div>
</div>

<div id="login-screen" style="display:none;">
  <div class="login-card">
    <div class="login-mark">
      <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="none" stroke="#B8892B" stroke-width="1.6"/><polygon points="24,10 27,24 24,28 21,24" fill="#1B2430"/><polygon points="24,38 27,24 24,20 21,24" fill="#B8892B"/></svg>
    </div>
    <h1>দিকনির্ণয়</h1>
    <p>আপনার ব্যক্তিগত ভর্তি প্রস্তুতির কমান্ড সেন্টার। শুরু করতে সাইন ইন করুন।</p>
    <button class="g-btn" id="google-btn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/></svg>

function toast(msg){

function renderMath(text){
  if(!text) return '';
  const esc0 = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let out = '', i = 0;
  while(i < text.length){
    if(text[i] === '$'){
      const end = text.indexOf('$', i+1);
      if(end === -1){ out += esc0(text.slice(i)); break; }
      const expr = text.slice(i+1, end);
      try{ out += katex.renderToString(expr, {throwOnError:false}); }
      catch(e){ out += esc0(expr); }
      i = end+1;
    } else {
      let next = text.indexOf('$', i);
      if(next === -1) next = text.length;
      out += esc0(text.slice(i, next));
      i = next;
    }
  }
  return out;
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('bn-BD', {day:'numeric', month:'short'}) + ' · ' + d.toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit'});
}
function fmtSecs(s){
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0');
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffleOptionsArr(options, correctIndex){
  const idxArr = options.map((_,i)=>i);
  for(let i=idxArr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idxArr[i],idxArr[j]]=[idxArr[j],idxArr[i]]; }
  const shuffled = idxArr.map(i=>options[i]);
  const newCorrectIndex = idxArr.indexOf(correctIndex);
  return { options: shuffled, correctIndex: newCorrectIndex };
}
async function runWithConcurrency(tasks, limit){
  const results = new Array(tasks.length);
  let idx = 0;
  async function worker(){
    while(idx < tasks.length){
      const cur = idx++;
      try{ results[cur] = await tasks[cur](); }
      catch(e){ results[cur] = null; }
    }
  }
  const workers = Array.from({length: Math.min(limit, tasks.length)}, worker);
  await Promise.all(workers);
  return results;
}

/* ============================= GEMINI: DYNAMIC MODEL-PROOF API LAYER =============================
   - "auto" mode asks Google which models are live right now and scores/picks the best one, cached 24h.
   - Every call SILENTLY walks a fallback chain on overload/quota/5xx/model-retired errors — the user
     never sees an error mid-flow; they just get their result, possibly from a different model.
   - Only a genuinely bad/restricted API key (401/403) is surfaced, since no amount of model-switching
     can fix an invalid credential.
================================================================================================= */
const FALLBACK_MODEL_CHAIN = [
  'gemini-2.5-flash',
  'gemini-flash-latest',
  'gemini-2.0-flash',
  'gemini-2.0-flash-001',
  'gemini-2.5-flash-lite',
  'gemini-2.5-pro',
  'gemini-1.5-flash-latest',
  'gemini-1.5-flash',
  'gemini-1.5-flash-8b',
  'gemini-1.5-pro-latest'
];

function scoreModelName(name){
  let s = 0;
  if(/flash/i.test(name)) s += 50;
  if(/latest/i.test(name)) s += 10;
  if(/lite/i.test(name)) s -= 5;
  if(/pro/i.test(name)) s += 15;
  const verMatch = name.match(/(\d+)\.(\d+)/);
  if(verMatch) s += (parseFloat(verMatch[1]+'.'+verMatch[2]) * 10);
  if(/vision|embedding|aqa|gemma|image|tts|native-audio/i.test(name)) s -= 1000;
  return s;
}
function isTransientError(e){
  if(!e) return false;
  if([429,500,502,503,504].includes(e.status)) return true;
  const msg = (e.message||'').toLowerCase();
  return /overloaded|unavailable|resource_exhausted|rate limit|timeout|deadline|internal error|try again|server error/.test(msg);
}
function isModelMissingError(e){
  if(!e) return false;
  if(e.status===404) return true;
  const msg = (e.message||'').toLowerCase();
  return /not found|deprecated|is not supported|unsupported model/.test(msg);
}
function isAuthError(e){
  if(!e) return false;
  if(e.status===401 || e.status===403) return true;
  const msg = (e.message||'').toLowerCase();
  return /api key not valid|permission denied|invalid authentication|oauth|api_key_invalid/.test(msg);
}

async function discoverBestModel(apiKey){
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(apiKey)}`);
  if(!res.ok) throw new Error('মডেল তালিকা আনা যায়নি');
  const data = await res.json();
  const models = (data.models||[])
    .filter(m => (m.supportedGenerationMethods||[]).includes('generateContent'))
    .map(m => (m.name||'').replace('models/',''))
    .filter(n => /gemini/i.test(n));
  if(models.length===0) throw new Error('কোনো ব্যবহারযোগ্য Gemini মডেল পাওয়া যায়নি');
  models.sort((a,b)=>scoreModelName(b)-scoreModelName(a));
  return models[0];
}
async function getActiveModel(apiKey, forceRefresh){
  const userModel = ((await sGet('geminiModel'))||'').trim();
  if(userModel && userModel.toLowerCase() !== 'auto') return userModel;
  const cache = await sGet('modelCache');
  const now = Date.now();
  if(!forceRefresh && cache && cache.model && (now - cache.at) < 24*3600*1000){
    return cache.model;
  }
  try{
    const best = await discoverBestModel(apiKey);
    await sSet('modelCache', {model:best, at:now});
    return best;
  }catch(e){
    return (cache && cache.model) || FALLBACK_MODEL_CHAIN[0];
  }
}

async function callGeminiAPI({text, imageBase64, imageMime}){
  const apiKey = await sGet('geminiApiKey');
  if(!apiKey) throw new Error('NO_API_KEY');

  const parts = [{ text }];
  if(imageBase64){ parts.push({ inline_data: { mime_type: imageMime || 'image/jpeg', data: imageBase64 } }); }
  const body = {
    contents: [{ role: 'user', parts }],
    generationConfig: { temperature: 0.65, response_mime_type: 'application/json' }
  };

  async function attempt(model){
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
    const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await res.json().catch(()=>({}));
    if(!res.ok){
      const err = new Error(data?.error?.message || ('HTTP '+res.status));
      err.status = res.status;
      throw err;
    }
    const outText = data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('') || '';
    if(!outText){ const err = new Error('EMPTY_RESPONSE'); throw err; }
    const cleaned = outText.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
    try{ return JSON.parse(cleaned); }
    catch(e){ const err = new Error('PARSE_FAILED'); throw err; }
  }

  const primaryModel = await getActiveModel(apiKey, false);
  const candidates = [primaryModel, ...FALLBACK_MODEL_CHAIN.filter(m=>m!==primaryModel)];
  let lastErr = null;

  for(const m of candidates){
    for(let retry=0; retry<2; retry++){
      try{
        const result = await attempt(m);
        if(m !== primaryModel){ await sSet('modelCache', {model:m, at:Date.now()}); } // self-heal for next time
        return result;
      }catch(e){
        lastErr = e;
        if(isAuthError(e)) throw e; // real credential problem — no fallback can fix this
        if(e.message==='PARSE_FAILED' || e.message==='EMPTY_RESPONSE'){ break; } // try a different model
        if(isTransientError(e) && !isModelMissingError(e) && retry===0){
          await sleep(350 + Math.random()*350);
          continue; // one quick silent retry on the same model (handles brief overload blips)
        }
        break; // move on to the next model in the chain, silently
      }
    }
  }
  throw lastErr || new Error('এই মুহূর্তে কোনো Gemini মডেল সাড়া দিচ্ছে না, একটু পর আবার চেষ্টা করো');
}

async function saveGroupForm(id){
  const name = document.getElementById('grp-name').value.trim();
  if(!name) return toast('নাম দিন');
  if(id){ const g = DB.groups.find(x=>x.id===id); g.name = name; }
  else { DB.groups.push({id:uid(), name, order:DB.groups.length}); }
  await saveGroups(); closeModal(); render();
}
async function deleteGroup(id){
  if(!confirm('এই গ্রুপ ও এর সব অধ্যায়/প্রশ্ন মুছে ফেলা হবে। নিশ্চিত?')) return;
  const chapIds = DB.chapters.filter(c=>c.groupId===id).map(c=>c.id);
  DB.questions = DB.questions.filter(q=>!chapIds.includes(q.chapterId));
  DB.chapters = DB.chapters.filter(c=>c.groupId!==id);
  DB.groups = DB.groups.filter(g=>g.id!==id);
  await saveGroups(); await saveChapters(); await saveQuestions(); render();
}

function openChapterForm(groupId, chapterId){
  const c = chapterId ? DB.chapters.find(x=>x.id===chapterId) : null;

    </div>`);

}
async function saveChapterForm(groupId, chapterId){
  const name = document.getElementById('chp-name').value.trim();
  if(!name) return toast('নাম দিন');
  if(chapterId){ const c = DB.chapters.find(x=>x.id===chapterId); c.name = name; }
  else { const count = DB.chapters.filter(c=>c.groupId===groupId).length; DB.chapters.push({id:uid(), groupId, name, order:count}); }
  await saveChapters(); closeModal(); render();
}
async function deleteChapter(id){
  if(!confirm('এই অধ্যায় ও এর প্রশ্ন মুছে ফেলা হবে। নিশ্চিত?')) return;
  DB.questions = DB.questions.filter(q=>q.chapterId!==id);
  DB.chapters = DB.chapters.filter(c=>c.id!==id);
  await saveChapters(); await saveQuestions(); render();
}

    <button class="btn btn-gold" onclick="openIngestModal('${chapterId}')">+ নতুন প্রশ্ন (AI)</button>`;

async function deleteQuestion(chapterId, id){
  if(!confirm('এই প্রশ্নটি মুছবেন?')) return;
  DB.questions = DB.questions.filter(x=>x.id!==id);

}

/* ============================= UNIFIED AI INGESTION ENGINE =============================
   ONE input box for everything: a single question, hundreds of pasted lines, raw notes,
   or a whole textbook page photo with an instruction like "extract 30 questions from this".
   The question is stored EXACTLY as given/extracted — no upfront "variations" are created
   here. Fresh variations are generated live, at exam time, from this saved data.
========================================================================================= */
let currentIngestChapterId = null;
let quickAddCount = 0;
let attachedImage = null; // {base64, mime}

function buildExtractionPrompt(rawText, hasImage){
  return `তুমি একজন বাংলাদেশের ভর্তি পরীক্ষা (মেডিকেল/ভার্সিটি ভর্তি, HSC/SSC) বিষয়ের অভিজ্ঞ শিক্ষক ও প্রশ্ন-বিশ্লেষক AI। ঠিক একটা সাধারণ AI চ্যাটবটের মতোই স্বাধীনভাবে বুঝে-শুনে সাড়া দেবে — নিচে যা দেওয়া হবে তা থেকে যতটা সম্ভব ভালো ও প্রাসঙ্গিক MCQ বের করে আনবে।

ব্যবহারকারী নিচে টেক্সট এবং/অথবা একটি ছবি দেবে। এটি হতে পারে:
- একটামাত্র প্রশ্ন,
- কপি-পেস্ট করা শত শত লাইনের প্রশ্নের তালিকা,
- বইয়ের/নোটের কাঁচা অনুচ্ছেদ (প্রশ্ন নিজে বানিয়ে নিতে হবে, অপশন/উত্তর নাও থাকতে পারে),
- অথবা পুরো একটা অধ্যায়ের/বইয়ের পাতার ছবি, সাথে হয়তো নির্দেশনা যেমন "এখান থেকে ৩০টা প্রশ্ন বানাও"।

টেক্সটে ব্যবহারকারীর কোনো স্পষ্ট নির্দেশনা থাকলে (কতগুলো প্রশ্ন চাই, কোন অংশ থেকে, কী রকম কঠিনতা) তা যথাসম্ভব অনুসরণ করো। নির্দেশনা না থাকলে টেক্সটে/ছবিতে যত প্রকৃত/সম্ভাব্য গুরুত্বপূর্ণ প্রশ্ন পাওয়া যায় প্রায় সবগুলোর জন্য একটা করে আইটেম বানাও।

প্রতিটি প্রশ্নের জন্য:
- "stem": প্রশ্নের সম্পূর্ণ বিবৃতি, মূল অর্থ ঠিক রেখে পরিষ্কারভাবে লেখা। গাণিতিক রাশি/সমীকরণ অবশ্যই $...$ এর মধ্যে বসাও (যেমন $x^2+5x=0$) যাতে সঠিকভাবে রেন্ডার হয়, নয়তো ভাঙা দেখাবে। প্রশ্নটি কোনো চিত্র/figure-এর উপর নির্ভরশীল হলে, প্রয়োজনীয় মান/সম্পর্কগুলো লেখার মধ্যেই স্পষ্টভাবে বর্ণনা করে দাও যাতে ছবি ছাড়াও প্রশ্নটি সমাধানযোগ্য থাকে।
- "options": ঠিক ৪টি অপশনের অ্যারে।
- "correctIndex": সঠিক অপশনের ইনডেক্স (0-3)। উৎসে উত্তর দেওয়া না থাকলে নিজে সঠিকভাবে সমাধান করে বের করো।
- "explanation": বিস্তারিত, নির্ভুল ও ধাপে ধাপে ব্যাখ্যা (কমপক্ষে ২-৩ বাক্য, প্রয়োজনে সূত্র/হিসাব দেখাও)।

গুরুত্বপূর্ণ: প্রশ্নটা উৎসে যেভাবে আছে ঠিক সেভাবেই সংরক্ষণ করবে — নিজে থেকে সংখ্যা/প্রসঙ্গ বদলে "ভ্যারিয়েশন" বানানোর দরকার নেই, সেটা পরীক্ষার সময় আলাদাভাবে করা হবে।

ঠিক এই আকারে আউটপুট দাও (অন্য কিছু লিখবে না, মার্কডাউন কোড ব্লকও না):
{ "items": [ {"stem":"...","options":["...","...","...","..."],"correctIndex":0,"explanation":"..."} ] }

মূল ভাষা (বাংলা/ইংরেজি) বজায় রাখো। শুধুমাত্র বৈধ JSON আউটপুট দাও।

ব্যবহারকারীর টেক্সট/নির্দেশনা:
${rawText || '(সংযুক্ত ছবি থেকে প্রশ্ন(সমূহ) বিশ্লেষণ/তৈরি করো)'}`;
}

function manualOptRow(val, i, checked){

function openQuestionEditForm(chapterId, questionId){
  const q = DB.questions.find(x=>x.id===questionId);

    <h3>প্রশ্ন সম্পাদনা</h3>

      <div id="q-opt-rows">${q.options.map((o,i)=>manualOptRow(o,i,i===q.correctIndex)).join('')}</div>
    </div>

async function saveManualQuestion(chapterId, questionId){
  const stem = document.getElementById('q-stem-manual').value.trim();
  if(!stem) return toast('প্রশ্ন লিখুন');
  const opts = [...document.querySelectorAll('.q-opt-manual')].map(x=>x.value.trim());
  if(opts.some(o=>!o)) return toast('সব অপশন পূরণ করুন');
  const checked = document.querySelector('input[name=q-correct-opt]:checked');
  const correctIndex = checked ? parseInt(checked.value) : 0;
  const explanation = document.getElementById('q-expl-manual').value.trim();
  if(questionId){
    const q = DB.questions.find(x=>x.id===questionId);
    Object.assign(q, {stem, options:opts, correctIndex, explanation});
  } else {
    DB.questions.push({id:uid(), chapterId, stem, options:opts, correctIndex, explanation});
  }
  await saveQuestions(); closeModal(); toast('সংরক্ষিত হয়েছে');
  document.getElementById('view').innerHTML = viewQuestionList(chapterId);
}
function insertQuestionFromItem(chapterId, item){
  if(!item || !item.stem || !Array.isArray(item.options) || item.options.length<2) return false;
  let correctIndex = Number.isInteger(item.correctIndex) ? item.correctIndex : 0;
  if(correctIndex<0 || correctIndex>=item.options.length) correctIndex = 0;
  DB.questions.push({
    id: uid(), chapterId,
    stem: item.stem,
    options: item.options,
    correctIndex,
    explanation: item.explanation || ''
  });
  return true;
}
async function runIngest(){
  const rawTextEl = document.getElementById('ai-raw-text');
  const rawText = rawTextEl ? rawTextEl.value.trim() : '';
  if(!rawText && !attachedImage){ toast('টেক্সট লেখো, বলো, অথবা ছবি দাও'); return; }
  const apiKey = await sGet('geminiApiKey');
  if(!apiKey){ toast('প্রথমে Gemini API Key সেট করো'); openSettingsModal(); return; }

  const btn = document.getElementById('ai-parse-btn');
  btn.disabled = true; const prevLabel = btn.textContent; btn.textContent = '⏳';
  try{
    const prompt = buildExtractionPrompt(rawText, !!attachedImage);
    const data = await callGeminiAPI({
      text: prompt,
      imageBase64: attachedImage ? attachedImage.base64 : undefined,
      imageMime: attachedImage ? attachedImage.mime : undefined
    });
    const items = Array.isArray(data.items) ? data.items : [];
    if(items.length===0){ toast('AI কোনো প্রশ্ন শনাক্ত করতে পারেনি, আরেকটু স্পষ্ট করে দাও'); return; }
    let added = 0;
    items.forEach(it=>{ if(insertQuestionFromItem(currentIngestChapterId, it)) added++; });
    if(added===0){ toast('AI বুঝতে পারেনি, আরেকটু স্পষ্ট করে দাও'); return; }
    await saveQuestions();
    quickAddCount += added;
    const c1 = document.getElementById('quick-add-count'); if(c1) c1.textContent = quickAddCount;
    rawTextEl.value=''; autoGrowInput(rawTextEl); clearAttachment();
    toast(`✅ ${added} টি প্রশ্ন যোগ হয়েছে`);
    rawTextEl.focus();
  }catch(e){
    if(e.message==='NO_API_KEY'){ toast('প্রথমে API Key সেট করো'); openSettingsModal(); }
    else toast('সমস্যা হয়েছে: ' + e.message);
  }finally{
    btn.disabled = false; btn.textContent = prevLabel;
  }
}

    r.readAsDataURL(file);

/* ============================= LIVE EXAM-TIME AI QUESTION GENERATION =============================
   The saved questions are the raw source. Every time an exam starts, AI generates a FRESH,
   unique variation of each one that's needed (new numbers if numeric, new phrasing/context if
   conceptual) — so no two questions in one exam are ever identical, and no exam repeats the last.
   Requests are chunked + run with limited concurrency for speed; if AI is unavailable, it falls
   back to the original question (shuffled options) so the exam never fails to start.
================================================================================================= */
function buildExamGenPrompt(items){
  const payload = items.map(it=>({
    id: it.id, need: it.need, stem: it.stem, options: it.options,
    correctIndex: it.correctIndex, explanation: it.explanation||''
  }));
  return `তুমি একজন বাংলাদেশের ভর্তি পরীক্ষা প্রস্তুতি বিশেষজ্ঞ AI। নিচে কিছু মূল (সোর্স) MCQ দেওয়া হলো — প্রতিটির সাথে "need" সংখ্যা আছে, তার মানে ঠিক ততগুলো সম্পূর্ণ নতুন, সতেজ ভ্যারিয়েশন বানাতে হবে।

নিয়মাবলী:
- সংখ্যাভিত্তিক/গাণিতিক প্রশ্ন হলে সংখ্যা বদলে দাও — তবে আসল ভর্তি পরীক্ষার মতোই হাতে-কলমে সহজে সমাধানযোগ্য মান রাখবে, অহেতুক বড়/জটিল সংখ্যা নয় — এবং অপশন ও সঠিক উত্তর নতুন সংখ্যা অনুযায়ী পুনরায় সঠিকভাবে হিসাব করে বসাও।
- ধারণাভিত্তিক/তাত্ত্বিক প্রশ্ন হলে প্রসঙ্গ/উদাহরণ/শব্দচয়ন বদলে দাও, মূল ধারণা অক্ষুণ্ণ রেখে।
- একই "id"-এর একাধিক ভ্যারিয়েশন চাইলে সেগুলো একে অপরের থেকেও সম্পূর্ণ ভিন্ন হতে হবে। পুরো তালিকার কোনো দুটি আইটেমই একে অপরের সাথে হুবহু বা প্রায় হুবহু মিলবে না।
- মূল প্রশ্ন কোনো চিত্র/figure-নির্ভর হলে, প্রয়োজনীয় মান লেখাতেই বর্ণনা করে দাও যাতে ছবি ছাড়াই সমাধানযোগ্য থাকে।
- গাণিতিক রাশি লিখতে $...$ ব্যবহার করো।
- প্রতিটি ব্যাখ্যা বিস্তারিত, নির্ভুল ও ধাপে ধাপে হতে হবে (কমপক্ষে ২-৩ বাক্য)।
- ৪টি করে অপশন, ঠিক একটি সঠিক।
- মূল ভাষা (বাংলা/ইংরেজি) বজায় রাখো।

ঠিক এই আকারে আউটপুট দাও (অন্য কিছু লিখবে না, মার্কডাউন কোড ব্লকও না):
{ "generated": [ {"sourceId":"...", "stem":"...", "options":["...","...","...","..."], "correctIndex":0, "explanation":"..."} ] }

সোর্স প্রশ্নসমূহ:
${JSON.stringify(payload)}`;
}
function normalizeSig(stem){
  return (stem||'').toLowerCase().replace(/[^\u0980-\u09FF0-9a-z]/g,'').slice(0,140);
}
async function generateExamQuestionsForExam(pool, n, onProgress){
  const apiKey = await sGet('geminiApiKey');

  // Decide how many fresh copies each source question needs, round-robin across a shuffled pool.
  let poolShuffled = [...pool];
  for(let i=poolShuffled.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [poolShuffled[i],poolShuffled[j]]=[poolShuffled[j],poolShuffled[i]]; }
  const needMap = new Map();
  let total = 0, i = 0, guard = 0;
  while(total < n && guard < n*6){
    const item = poolShuffled[i % poolShuffled.length];
    needMap.set(item.id, (needMap.get(item.id)||0)+1);
    total++; i++; guard++;
  }
  const byId = new Map(pool.map(p=>[p.id,p]));
  const needItems = [...needMap.entries()].map(([id,need])=>({...byId.get(id), need}));

  const finalQuestions = [];
  const usedSig = new Set();
  function pushUnique(q, allowDup){
    const s = normalizeSig(q.stem);
    if(s && usedSig.has(s) && !allowDup) return false;
    if(s) usedSig.add(s);
    finalQuestions.push(q);
    return true;
  }
  function fallbackFrom(it){
    const {options, correctIndex} = shuffleOptionsArr(it.options, it.correctIndex);
    return { chapterId: it.chapterId, stem: it.stem, options, correctIndex, explanation: it.explanation||'' };
  }

  if(!apiKey){
    // No API key at all — exam still works, just uses the saved questions directly (shuffled options).
    needItems.forEach(it=>{ for(let k=0;k<it.need;k++){ const q = fallbackFrom(it); if(!pushUnique(q)) pushUnique(q,true); } });
    return finalQuestions.slice(0,n);
  }

  // Chunk by cumulative "need" (not item count) so each request stays small & fast.
  const chunks = []; let cur = [], curNeed = 0;
  for(const it of needItems){
    if(curNeed + it.need > 15 && cur.length){ chunks.push(cur); cur=[]; curNeed=0; }
    cur.push(it); curNeed += it.need;
  }
  if(cur.length) chunks.push(cur);

  let done = 0;
  const tasks = chunks.map(chunk => async ()=>{
    try{
      const data = await callGeminiAPI({ text: buildExamGenPrompt(chunk) });
      done++; if(onProgress) onProgress(done, chunks.length);
      return Array.isArray(data.generated) ? data.generated : [];
    }catch(e){
      done++; if(onProgress) onProgress(done, chunks.length);
      return null;
    }
  });
  const results = await runWithConcurrency(tasks, 3);

  results.forEach((gen, ci)=>{
    const chunk = chunks[ci];
    const bySource = {};
    if(Array.isArray(gen)){ gen.forEach(g=>{ if(g && g.sourceId){ (bySource[g.sourceId]=bySource[g.sourceId]||[]).push(g); } }); }
    chunk.forEach(it=>{
      const arr = bySource[it.id] || [];
      let used = 0;
      for(const g of arr){
        if(used>=it.need) break;
        if(!g || !g.stem || !Array.isArray(g.options) || g.options.length<2) continue;
        let ci2 = Number.isInteger(g.correctIndex) ? g.correctIndex : 0;
        if(ci2<0 || ci2>=g.options.length) ci2 = 0;
        const q = { chapterId: it.chapterId, stem:g.stem, options:g.options, correctIndex:ci2, explanation:g.explanation||it.explanation||'' };
        if(pushUnique(q)) used++;
      }
      for(; used<it.need; used++){
        const q = fallbackFrom(it);
        if(!pushUnique(q)) pushUnique(q, true);
        used = used; // fallback always counted to keep total correct
      }
    });
  });

  for(let i2=finalQuestions.length-1;i2>0;i2--){ const j=Math.floor(Math.random()*(i2+1)); [finalQuestions[i2],finalQuestions[j]]=[finalQuestions[j],finalQuestions[i2]]; }
  return finalQuestions.slice(0,n);
}

  openConfirmModal({
    title: 'পরীক্ষা থেকে বের হবে?',
    message: 'তোমার অগ্রগতি সংরক্ষিত থাকবে, পরে ফিরে এসে চালিয়ে যেতে পারবে।',
    confirmText: 'হ্যাঁ, বের হও',
    cancelText: 'থাকি',
    tone: 'default',
    onConfirm: ()=> nav('dashboard')
  });
}
function startExamTimerLoop(){
  clearInterval(examTick);
  examTick = setInterval(()=>{
    if(!currentExam || location.hash !== '#/exam'){ clearInterval(examTick); return; }
    const remaining = examRemainingSecs();
    const t = document.getElementById('exam-timer');
    if(t){ t.textContent = fmtSecs(remaining); t.classList.toggle('low', remaining<60); }
    if(remaining<=0){ clearInterval(examTick); submitExam(true); }
  }, 1000);
}
function confirmSubmitExam(){
  const total = currentExam.questions.length;
  const answered = Object.keys(currentExam.answers).length;
  const unans = total-answered;
  openConfirmModal({
    title: 'পরীক্ষা জমা দেবে?',
    message: `তুমি <b>${answered}/${total}</b> টি প্রশ্নের উত্তর দিয়েছ${unans?` — <b>${unans}টি এখনো অনুত্তরিত</b>`:''}। জমা দেওয়ার পর আর উত্তর বদলানো যাবে না।`,
    confirmText: 'হ্যাঁ, জমা দাও',
    cancelText: 'আরেকটু দেখি',
    tone: unans>0 ? 'danger' : 'default',
    onConfirm: ()=>{ clearInterval(examTick); submitExam(false); }
  });
}
async function submitExam(auto){
  let correct=0, wrong=0, unanswered=0;
  const breakdown = currentExam.questions.map((q,i)=>{
    const ans = currentExam.answers[i];
    let status;
    if(ans===undefined){ unanswered++; status='skip'; }
    else if(ans===q.correctIndex){ correct++; status='correct'; }
    else { wrong++; status='wrong'; }
    return {stem:q.stem, options:q.options, correctIndex:q.correctIndex, userAnswer:ans, status, explanation:q.explanation, chapterId:q.chapterId};
  });
  const score = Math.round((correct - wrong*0.25)*100)/100;
  const total = currentExam.questions.length;
  const timeUsed = Math.round((Date.now()-currentExam.startedAt)/1000);
  const record = {
    id: currentExam.id, date: Date.now(), total, correct, wrong, unanswered, score,
    percentage: Math.round((score/total)*1000)/10,
    accuracy: (correct+wrong)>0 ? Math.round((correct/(correct+wrong))*1000)/10 : 0,
    timeUsedSec: timeUsed, breakdown, auto
  };
  DB.history.push(record);
  await saveHistory();
  await clearExam();
  nav('result/'+record.id);
}

/* ============================= RESULT / REVIEW ============================= */
function viewResult(id){
  const r = DB.history.find(x=>x.id===id);
  if(!r) return '<div class="empty-hint">ফলাফল পাওয়া যায়নি।</div>';
  return `
  <div class="score-hero">
    <div class="score-num">${r.score}</div>
    <div class="score-label">স্কোর (মোট ${r.total} এর মধ্যে) · ${r.percentage}%</div>
  </div>
  <div class="stat-grid">
    <div class="stat"><div class="v correct">${r.correct}</div><div class="l">সঠিক</div></div>
    <div class="stat"><div class="v wrong">${r.wrong}</div><div class="l">ভুল</div></div>
    <div class="stat"><div class="v">${r.unanswered}</div><div class="l">অনুত্তরিত</div></div>
    <div class="stat"><div class="v">${r.accuracy}%</div><div class="l">নির্ভুলতা</div></div>
  </div>
  <div class="stat" style="margin-bottom:20px;"><div class="v">${fmtSecs(r.timeUsedSec)}</div><div class="l">ব্যবহৃত সময়</div></div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="nav('review/${r.id}')">উত্তরপত্র পর্যালোচনা</button>
    <button class="btn" onclick="nav('dashboard')">ড্যাশবোর্ডে ফিরুন</button>
  </div>`;
}
function viewReview(id){
  const r = DB.history.find(x=>x.id===id);
  if(!r) return '<div class="empty-hint">পাওয়া যায়নি।</div>';
  return `
  <h2 class="section-title">উত্তরপত্র পর্যালোচনা</h2>
  <p class="section-sub">${r.correct} সঠিক · ${r.wrong} ভুল · ${r.unanswered} অনুত্তরিত</p>
  ${r.breakdown.map((b,i)=>`
    <div class="review-item">
      <span class="review-tag ${b.status==='correct'?'tag-correct':b.status==='wrong'?'tag-wrong':'tag-skip'}">
        ${b.status==='correct'?'✓ সঠিক':b.status==='wrong'?'✕ ভুল':'— অনুত্তরিত'}
      </span>
      <div class="q-num">প্রশ্ন ${i+1}</div>
      <div class="q-stem" style="font-size:.98rem;">${renderMath(b.stem)}</div>
      ${b.options.map((o,oi)=>{
        let cls='';
        if(oi===b.correctIndex) cls='is-correct';
        else if(oi===b.userAnswer) cls='is-wrong';
        return `<div class="review-opt ${cls}">${renderMath(o)} ${oi===b.correctIndex?' ✓':(oi===b.userAnswer?' ✕':'')}</div>`;
      }).join('')}
      ${b.explanation?`<div class="explain-text"><b>ব্যাখ্যা:</b> ${renderMath(b.explanation)}</div>`:''}
    </div>`).join('')}
  <button class="btn" onclick="nav('performance')">পারফরম্যান্সে ফিরুন</button>`;
}

/* ============================= PERFORMANCE ============================= */
function viewPerformance(){
  if(DB.history.length===0){
    return `<h2 class="section-title">পারফরম্যান্স</h2><div class="empty-hint">এখনো কোনো পরীক্ষা সম্পন্ন হয়নি।</div>`;
  }
  const hist = [...DB.history].sort((a,b)=>a.date-b.date);
  const now = Date.now(), week = 7*24*3600*1000;
  const thisWeek = hist.filter(h=>now-h.date < week);
  const lastWeek = hist.filter(h=>now-h.date >= week && now-h.date < 2*week);
  const avg = arr => arr.length? Math.round(arr.reduce((s,h)=>s+h.percentage,0)/arr.length*10)/10 : null;
  const twAvg = avg(thisWeek), lwAvg = avg(lastWeek);
  const delta = (twAvg!==null && lwAvg!==null) ? Math.round((twAvg-lwAvg)*10)/10 : null;

  const chapStats = {};
  hist.forEach(h=>h.breakdown.forEach(b=>{
    chapStats[b.chapterId] = chapStats[b.chapterId] || {wrong:0, total:0};
    chapStats[b.chapterId].total++;
    if(b.status==='wrong') chapStats[b.chapterId].wrong++;
  }));
  const weakList = Object.entries(chapStats)
    .map(([cid,s])=>({cid, rate: s.wrong/s.total, ...s}))
    .filter(x=>x.total>=3 && x.rate>=0.35)
    .sort((a,b)=>b.rate-a.rate).slice(0,6);

  const maxPct = Math.max(...hist.map(h=>h.percentage), 100);
  const barsHtml = hist.slice(-12).map(h=>{
    const height = Math.max(4, (h.percentage/maxPct)*90);
    return `<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="font-size:.68rem; color:var(--ink-soft);">${h.percentage}%</div>
      <div style="width:60%; height:${height}px; background:var(--brass); border-radius:4px 4px 0 0;"></div>
    </div>`;
  }).join('');

  return `
  <h2 class="section-title">পারফরম্যান্স</h2>
  <div class="perf-summary">
    <div class="perf-card"><div class="v">${twAvg??'—'}${twAvg!==null?'%':''}</div><div class="l">এই সপ্তাহ</div></div>
    <div class="perf-card"><div class="v">${lwAvg??'—'}${lwAvg!==null?'%':''}</div><div class="l">গত সপ্তাহ</div></div>
    <div class="perf-card"><div class="v ${delta>0?'up':delta<0?'down':''}">${delta===null?'—':(delta>0?'+':'')+delta+'%'}</div><div class="l">পরিবর্তন</div></div>
  </div>
  <div class="chart-wrap">
    <div style="display:flex; align-items:flex-end; gap:8px; height:110px;">${barsHtml}</div>
  </div>
  ${weakList.length? `
  <h3 style="margin-bottom:10px; font-size:1rem;">দুর্বল অধ্যায়সমূহ</h3>
  ${weakList.map(w=>{
    const chap = DB.chapters.find(c=>c.id===w.cid);
    return `<div class="weak-row"><span>${esc(chap?chap.name:'—')}</span><span>${Math.round(w.rate*100)}% ভুল</span></div>`;
  }).join('')}
  <button class="btn btn-gold" style="margin:14px 0 26px;" onclick='practiceWeak(${JSON.stringify(weakList.map(w=>w.cid))})'>দুর্বল জায়গা প্র্যাকটিস করুন</button>
  ` : ''}
  <h3 style="margin-bottom:10px; font-size:1rem;">পরীক্ষার ইতিহাস</h3>
  ${[...hist].reverse().map(h=>`
    <div class="hist-item" onclick="nav('result/${h.id}')" style="cursor:pointer;">
      <div class="l">${fmtDate(h.date)} · ${h.total} প্রশ্ন</div>
      <div class="r">${h.percentage}%</div>
    </div>`).join('')}
  `;
}
window.practiceWeak = function(cids){ beginExam(cids); };

/* ============================= KEYBOARD & MOUSE SHORTCUTS ============================= */
document.addEventListener('keydown', (e)=>{
  const modalOpen = document.getElementById('modal-overlay').classList.contains('show');
  const active = document.activeElement;
  const inTextarea = active && active.tagName === 'TEXTAREA';
  const inInput = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT');

  if(e.key === 'Escape'){
    if(modalOpen){ closeModal(); e.preventDefault(); return; }
    if(location.hash === '#/exam'){ return; }
    if(location.hash !== '#/dashboard' && location.hash !== '' && location.hash !== '#/'){
      nav('dashboard'); e.preventDefault();
    }
    return;
  }

  if(e.key === 'Enter' && active && active.id === 'ai-raw-text' && !e.shiftKey){
    e.preventDefault();
    const btn = document.getElementById('ai-parse-btn');
    if(btn && !btn.disabled) btn.click();
    return;
  }

  if(e.key === 'Enter' && modalOpen && !inTextarea){
    const primaryBtn = document.querySelector('#modal-body .btn-primary, #modal-body .btn-gold');
    if(primaryBtn){ e.preventDefault(); primaryBtn.click(); }
    return;
  }

  if(location.hash === '#/exam' && currentExam && !inInput && !modalOpen){
    const idx = currentExam._focusIdx || 0;
    const q = currentExam.questions[idx];
    if(['1','2','3','4','5','6'].includes(e.key) && q){
      const optIdx = parseInt(e.key)-1;
      if(optIdx < q.options.length){ e.preventDefault(); selectAnswer(idx, optIdx); }
      return;
    }
    if(e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ' || e.code === 'Space'){
      e.preventDefault();
      if(idx < currentExam.questions.length-1) examGo(idx+1); else confirmSubmitExam();
      return;
    }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); examGo(idx-1); return; }
  }
});
document.addEventListener('dblclick', (e)=>{
  if(location.hash !== '#/exam' || !currentExam) return;
  const wrap = document.getElementById('q-wrap');
  if(!wrap || !wrap.contains(e.target)) return;
  const idx = currentExam._focusIdx || 0;
  if(idx < currentExam.questions.length-1) examGo(idx+1); else confirmSubmitExam();
});

/* ============================= ANTI-CHEAT (light, exam view only) ============================= */
document.addEventListener('contextmenu', e=>{ if(location.hash==='#/exam') e.preventDefault(); });
document.addEventListener('copy', e=>{ if(location.hash==='#/exam') e.preventDefault(); });
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && location.hash==='#/exam') toast('⚠ ট্যাব পরিবর্তন শনাক্ত হয়েছে');
});

/* ============================= BOOT ============================= */
async function boot(){
  await loadDB();
  setTimeout(()=>{ document.getElementById('intro').classList.add('hide'); }, 2200);
  setTimeout(async ()=>{
    if(DB.profile){
      enterApp();
      if(currentExam && currentExam.status==='active'){
        if(examRemainingSecs()<=0){ await submitExam(true); }
        else { nav('exam'); }
      }
    } else {
      document.getElementById('login-screen').style.display='flex';
    }
  }, 2300);
}
boot();
