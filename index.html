<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>দিকনির্ণয় — ভর্তি প্রস্তুতি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{
  --ink:#1B2430; --ink-soft:#3A4453;
  --parchment:#F7F4EC; --paper:#FFFFFF;
  --brass:#B8892B; --brass-dim:#E7D5A9;
  --teal:#2F6F5E; --clay:#B5533C;
  --line:#E4DFD1;
  --shadow: 0 1px 2px rgba(27,36,48,.06), 0 6px 20px rgba(27,36,48,.05);
  --radius: 14px;
  font-size: 16px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Hind Siliguri','Inter',sans-serif;
  background:var(--parchment); color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,.serif{font-family:'Source Serif 4', serif;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

/* ---------- Compass intro ---------- */
#intro{
  position:fixed; inset:0; background:var(--ink); z-index:999;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  transition:opacity .7s ease, visibility .7s ease;
}
#intro.hide{opacity:0; visibility:hidden; pointer-events:none;}
.compass{width:120px; height:120px; position:relative;}
.compass svg{width:100%; height:100%;}
.needle{transform-origin:60px 60px; animation: settle 2.1s cubic-bezier(.22,1,.36,1) forwards;}
@keyframes settle{
  0%{transform:rotate(390deg); opacity:0;}
  35%{opacity:1;}
  60%{transform:rotate(-18deg);}
  80%{transform:rotate(6deg);}
  100%{transform:rotate(0deg);}
}
.intro-word{color:var(--brass-dim); font-family:'Source Serif 4',serif; font-size:1.05rem; letter-spacing:.04em; margin-top:22px; opacity:0; animation:fadeUp 1s ease forwards; animation-delay:1.1s;}
@keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* ---------- Login ---------- */
#login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
.login-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:40px 36px; max-width:380px; width:100%; text-align:center;}
.login-mark{width:46px; height:46px; margin:0 auto 18px;}
.login-card h1{font-size:1.5rem; margin-bottom:6px;}
.login-card p{color:var(--ink-soft); font-size:.92rem; margin-bottom:26px; line-height:1.55;}
.g-btn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:13px 16px; border:1px solid var(--line); border-radius:10px; background:var(--paper); font-size:.95rem; font-weight:600; color:var(--ink); transition:border-color .2s, box-shadow .2s;}
.g-btn:hover{border-color:var(--brass); box-shadow:0 2px 10px rgba(184,137,43,.15);}
.login-note{margin-top:16px; font-size:.78rem; color:#9A9384;}

/* ---------- App shell ---------- */
#app{min-height:100vh; display:none;}
#app.show{display:block; animation:fadeIn .5s ease;}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.topbar{position:sticky; top:0; z-index:20; background:rgba(247,244,236,.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:14px 22px;}
.brand{display:flex; align-items:center; gap:10px; font-family:'Source Serif 4',serif; font-weight:600; font-size:1.05rem;}
.brand svg{width:26px; height:26px;}
.topbar-right{display:flex; align-items:center; gap:14px; font-size:.85rem; color:var(--ink-soft);}
.back-btn{background:none; border:none; color:var(--ink-soft); font-size:.9rem; display:flex; align-items:center; gap:6px;}
.back-btn:hover{color:var(--brass);}
main{max-width:960px; margin:0 auto; padding:28px 20px 80px;}
.view-enter{animation:slideUp .4s cubic-bezier(.22,1,.36,1);}
@keyframes slideUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

.section-title{font-size:1.4rem; margin-bottom:4px;}
.section-sub{color:var(--ink-soft); font-size:.9rem; margin-bottom:22px;}

/* Dashboard */
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:8px;}
@media(max-width:640px){.tiles{grid-template-columns:1fr;}}
.tile{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:26px 22px; box-shadow:var(--shadow); transition:transform .25s ease, box-shadow .25s ease; text-align:left;}
.tile:hover{transform:translateY(-3px); box-shadow:0 10px 26px rgba(27,36,48,.09);}
.tile .icon{width:30px; height:30px; margin-bottom:14px; color:var(--brass);}
.tile h3{font-size:1.08rem; margin-bottom:5px;}
.tile p{color:var(--ink-soft); font-size:.85rem; line-height:1.5;}

/* Cards / tree */
.group-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:14px; box-shadow:var(--shadow); overflow:hidden;}
.group-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; cursor:pointer;}
.group-head-left{display:flex; align-items:center; gap:10px;}
.chev{width:16px; height:16px; transition:transform .25s ease; color:var(--ink-soft);}
.group-card.open .chev{transform:rotate(90deg);}
.group-title{font-weight:600; font-size:1rem;}
.group-meta{color:var(--ink-soft); font-size:.78rem;}
.group-body{max-height:0; overflow:hidden; transition:max-height .35s ease;}
.group-card.open .group-body{max-height:2000px;}
.chapter-row{display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--line);}
.chapter-row:hover{background:#FBF9F3;}
.chapter-name{font-size:.93rem; font-weight:500;}
.chapter-count{font-size:.78rem; color:var(--ink-soft);}
.row-actions{display:flex; gap:6px;}
.icon-btn{width:30px; height:30px; border:none; background:none; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); transition:background .2s,color .2s;}
.icon-btn:hover{background:var(--brass-dim); color:var(--ink);}
.icon-btn svg{width:15px; height:15px;}
.add-row{padding:10px 18px; border-top:1px solid var(--line);}
.link-btn{background:none; border:none; color:var(--brass); font-weight:600; font-size:.85rem;}
.link-btn:hover{text-decoration:underline;}
.empty-hint{color:var(--ink-soft); font-size:.85rem; padding:24px 4px;}

/* Buttons */
.btn{padding:11px 20px; border-radius:10px; border:1px solid var(--line); background:var(--paper); font-size:.9rem; font-weight:600; color:var(--ink); transition:all .2s;}
.btn:hover{border-color:var(--brass);}
.btn-primary{background:var(--ink); color:#fff; border-color:var(--ink);}
.btn-primary:hover{background:#0f151d;}
.btn-gold{background:var(--brass); color:#fff; border-color:var(--brass);}
.btn-gold:hover{background:#a37820;}
.btn-danger{color:var(--clay); border-color:var(--clay);}
.btn-danger:hover{background:#FBEAE5;}
.btn-block{width:100%;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap;}

/* Modal */
.overlay{position:fixed; inset:0; background:rgba(27,36,48,.45); display:flex; align-items:center; justify-content:center; z-index:200; padding:16px; opacity:0; visibility:hidden; transition:opacity .25s ease, visibility .25s ease;}
.overlay.show{opacity:1; visibility:visible;}
.modal{background:var(--paper); border-radius:var(--radius); padding:26px; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.25); transform:scale(.96) translateY(6px); transition:transform .25s ease;}
.overlay.show .modal{transform:scale(1) translateY(0);}
.modal h3{margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:.8rem; color:var(--ink-soft); margin-bottom:6px; font-weight:600;}
.field input,.field select,.field textarea{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:.92rem; background:#FDFCF9;}
.field textarea{min-height:70px; resize:vertical;}
.field-row{display:flex; gap:10px;}
.field-row>.field{flex:1;}
.opt-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.opt-row input[type=text]{flex:1;}
.opt-row input[type=radio]{width:18px; height:18px; accent-color:var(--teal);}
.hint{font-size:.76rem; color:#9A9384; margin-top:4px;}

/* Exam setup */
.preset-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px;}
@media(max-width:640px){.preset-grid{grid-template-columns:repeat(2,1fr);}}
.preset{border:1px solid var(--line); border-radius:12px; padding:16px 12px; text-align:center; background:var(--paper); transition:all .2s;}
.preset.active,.preset:hover{border-color:var(--brass); box-shadow:0 4px 14px rgba(184,137,43,.15);}
.preset .n{font-size:1.3rem; font-weight:700; font-family:'Source Serif 4',serif;}
.preset .t{font-size:.76rem; color:var(--ink-soft);}
.select-check{width:19px; height:19px; accent-color:var(--brass); flex-shrink:0;}

/* Exam runner */
.exam-top{display:flex; align-items:center; justify-content:space-between; padding:14px 20px; background:var(--paper); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10;}
.timer{font-family:'Source Serif 4',serif; font-size:1.15rem; font-weight:600; padding:6px 14px; border-radius:8px; background:var(--parchment); border:1px solid var(--line);}
.timer.low{color:var(--clay); border-color:var(--clay); background:#FBEAE5;}
.progress-bar{height:4px; background:var(--line); position:sticky; top:57px; z-index:9;}
.progress-fill{height:100%; background:var(--brass); transition:width .3s ease;}
.q-wrap{max-width:680px; margin:0 auto; padding:30px 20px 100px;}
.q-num{color:var(--ink-soft); font-size:.85rem; margin-bottom:10px;}
.q-stem{font-size:1.08rem; line-height:1.7; margin-bottom:22px;}
.q-fig{max-width:100%; margin:0 0 18px; border-radius:8px; border:1px solid var(--line);}
.opt{display:flex; align-items:center; gap:14px; padding:14px 16px; border:1.5px solid var(--line); border-radius:12px; margin-bottom:10px; background:var(--paper); transition:border-color .18s, background .18s;}
.opt:hover{border-color:var(--brass-dim);}
.opt.selected{border-color:var(--ink); background:#F1EEE4;}
.opt.locked{cursor:default;}
.radio-dot{width:20px; height:20px; border-radius:50%; border:2px solid #C9C2AF; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.opt.selected .radio-dot{border-color:var(--ink);}
.radio-dot .fill{width:10px; height:10px; border-radius:50%; background:var(--ink); display:none;}
.opt.selected .radio-dot .fill{display:block;}
.opt-text{font-size:.96rem;}
.exam-nav{position:fixed; bottom:0; left:0; right:0; background:var(--paper); border-top:1px solid var(--line); padding:12px 20px; display:flex; justify-content:space-between; gap:10px;}

/* Result */
.score-hero{text-align:center; padding:30px 0 10px;}
.score-num{font-family:'Source Serif 4',serif; font-size:3.4rem; font-weight:700; color:var(--ink);}
.score-label{color:var(--ink-soft); font-size:.9rem;}
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:26px 0;}
@media(max-width:640px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px; text-align:center;}
.stat .v{font-size:1.25rem; font-weight:700; font-family:'Source Serif 4',serif;}
.stat .l{font-size:.72rem; color:var(--ink-soft); margin-top:2px;}
.v.correct{color:var(--teal);} .v.wrong{color:var(--clay);}

/* Review */
.review-item{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:12px;}
.review-tag{display:inline-flex; align-items:center; gap:6px; font-size:.76rem; font-weight:700; padding:3px 10px; border-radius:20px; margin-bottom:10px;}
.tag-correct{background:#E4F1EC; color:var(--teal);}
.tag-wrong{background:#FBEAE5; color:var(--clay);}
.tag-skip{background:#EFEAE0; color:var(--ink-soft);}
.review-opt{padding:8px 12px; border-radius:8px; font-size:.88rem; margin-bottom:6px; border:1px solid var(--line);}
.review-opt.is-correct{border-color:var(--teal); background:#F1F8F5;}
.review-opt.is-wrong{border-color:var(--clay); background:#FDF2EF;}

/* Performance */
.perf-summary{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px;}
@media(max-width:640px){.perf-summary{grid-template-columns:1fr;}}
.perf-card{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:16px 18px;}
.perf-card .v{font-size:1.4rem; font-weight:700; font-family:'Source Serif 4',serif;}
.perf-card .l{font-size:.78rem; color:var(--ink-soft);}
.perf-card .delta{font-size:.8rem; font-weight:600; margin-top:4px;}
.up{color:var(--teal);} .down{color:var(--clay);}
.chart-wrap{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:22px;}
.hist-item{display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; background:var(--paper);}
.hist-item .l{font-size:.85rem; color:var(--ink-soft);}
.hist-item .r{font-weight:700; font-family:'Source Serif 4',serif;}
.weak-row{display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-radius:8px; background:#FBF3EA; margin-bottom:6px; font-size:.87rem;}

/* Toast / confirm */
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:12px 20px; border-radius:10px; font-size:.87rem; opacity:0; visibility:hidden; transition:all .3s ease; z-index:300;}
.toast.show{opacity:1; visibility:visible; transform:translateX(-50%) translateY(0);}
.watermark{position:fixed; inset:0; pointer-events:none; z-index:1; opacity:.035; display:flex; align-items:center; justify-content:center; font-size:3rem; font-family:'Source Serif 4',serif; transform:rotate(-25deg); user-select:none;}
.katex{font-size:1.02em;}
::selection{background:var(--brass-dim);}
</style>
</head>
<body>

<div id="intro">
  <div class="compass">
    <svg viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="52" fill="none" stroke="#E7D5A9" stroke-width="1.4" opacity=".5"/>
      <circle cx="60" cy="60" r="38" fill="none" stroke="#E7D5A9" stroke-width="1" opacity=".35"/>
      <g class="needle">
        <polygon points="60,20 67,60 60,68 53,60" fill="#B8892B"/>
        <polygon points="60,100 67,60 60,52 53,60" fill="#5b4a2c"/>
      </g>
      <circle cx="60" cy="60" r="4" fill="#F7F4EC"/>
    </svg>
  </div>
  <div class="intro-word">দিকনির্ণয়</div>
</div>

<div id="login-screen" style="display:none;">
  <div class="login-card">
    <div class="login-mark">
      <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="none" stroke="#B8892B" stroke-width="1.6"/><polygon points="24,10 27,24 24,28 21,24" fill="#1B2430"/><polygon points="24,38 27,24 24,20 21,24" fill="#B8892B"/></svg>
    </div>
    <h1>দিকনির্ণয়</h1>
    <p>আপনার ব্যক্তিগত ভর্তি প্রস্তুতির কমান্ড সেন্টার। শুরু করতে সাইন ইন করুন।</p>
    <button class="g-btn" id="google-btn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Google দিয়ে সাইন ইন করুন
    </button>
    <div class="login-note">এই ডেমো সংস্করণে প্রোফাইল আপনার ব্রাউজারে নিরাপদভাবে সংরক্ষিত থাকে।</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="none" stroke="#B8892B" stroke-width="1.6"/><polygon points="24,10 27,24 24,28 21,24" fill="#1B2430"/><polygon points="24,38 27,24 24,20 21,24" fill="#B8892B"/></svg>
      <span>দিকনির্ণয়</span>
    </div>
    <div class="topbar-right">
      <button class="back-btn" id="topbar-back" style="display:none;">← ড্যাশবোর্ড</button>
      <span id="topbar-name"></span>
      <button class="back-btn" id="signout-btn">সাইন আউট</button>
    </div>
  </div>
  <main id="view" class="view-enter"></main>
</div>

<div class="overlay" id="modal-overlay"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================= STORAGE LAYER ============================= */
const mem = {};
const LS_PREFIX = 'digniroy:';
async function sGet(key){
  try{
    const raw = localStorage.getItem(LS_PREFIX+key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return mem[key] !== undefined ? mem[key] : null; }
}
async function sSet(key, val){
  try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(val)); }
  catch(e){ mem[key] = val; }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* ============================= APP STATE ============================= */
let DB = { profile:null, groups:[], chapters:[], templates:[], history:[] };
let currentExam = null; // in-progress exam object

async function loadDB(){
  DB.profile = await sGet('profile');
  DB.groups = (await sGet('groups')) || [];
  DB.chapters = (await sGet('chapters')) || [];
  DB.templates = (await sGet('templates')) || [];
  DB.history = (await sGet('history')) || [];
  currentExam = await sGet('exam:current');
}
async function saveGroups(){ await sSet('groups', DB.groups); }
async function saveChapters(){ await sSet('chapters', DB.chapters); }
async function saveTemplates(){ await sSet('templates', DB.templates); }
async function saveHistory(){ await sSet('history', DB.history); }
async function saveExam(){ await sSet('exam:current', currentExam); }
async function clearExam(){ currentExam = null; try{ localStorage.removeItem(LS_PREFIX+'exam:current'); }catch(e){ delete mem['exam:current']; } }

/* ============================= UTIL ============================= */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2200);
}
function renderMath(text){
  if(!text) return '';
  // split on $...$ segments, render each with KaTeX, escape the rest
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let out = '', i = 0;
  while(i < text.length){
    if(text[i] === '$'){
      const end = text.indexOf('$', i+1);
      if(end === -1){ out += esc(text.slice(i)); break; }
      const expr = text.slice(i+1, end);
      try{ out += katex.renderToString(expr, {throwOnError:false}); }
      catch(e){ out += esc(expr); }
      i = end+1;
    } else {
      let next = text.indexOf('$', i);
      if(next === -1) next = text.length;
      out += esc(text.slice(i, next));
      i = next;
    }
  }
  return out;
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('bn-BD', {day:'numeric', month:'short'}) + ' · ' + d.toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit'});
}
function fmtSecs(s){
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0');
}

  else if(route==='data') view.innerHTML = await viewData();

async function saveTemplateForm(chapterId, templateId){
  const stem = document.getElementById('tpl-stem').value.trim();
  if(!stem) return toast('প্রশ্ন লিখুন');
  const names = [...document.querySelectorAll('.var-name')].map(x=>x.value.trim());
  const mins = [...document.querySelectorAll('.var-min')].map(x=>parseFloat(x.value));
  const maxs = [...document.querySelectorAll('.var-max')].map(x=>parseFloat(x.value));
  const variables = names.map((n,i)=>({name:n, min:mins[i], max:maxs[i]})).filter(v=>v.name);
  const exprs = [...document.querySelectorAll('.opt-expr')].map(x=>x.value.trim());
  const correctIndex = parseInt(document.querySelector('input[name=correct-opt]:checked').value);
  const explanation = document.getElementById('tpl-expl').value.trim();
  if(exprs.some(e=>!e)) return toast('সব অপশন পূরণ করুন');
  const data = {chapterId, stem, variables, optionExprs:exprs, correctIndex, explanation};
  if(templateId){ Object.assign(DB.templates.find(x=>x.id===templateId), data); }
  else { DB.templates.push({id:uid(), ...data}); }
  await saveTemplates(); closeModal(); toast('সংরক্ষিত হয়েছে'); render();
}

/* ============================= VARIATION ENGINE ============================= */
function subst(text, values){
  return text.replace(/\{(\w+)\}/g, (m,k)=> values[k]!==undefined ? values[k] : m);
}
function safeEval(expr, scope){
  try{
    const v = math.evaluate(expr, scope);
    if(typeof v !== 'number' || !isFinite(v) || Number.isNaN(v)) return null;
    return Math.round(v*1000)/1000;
  }catch(e){ return null; }
}
function generateVariation(template, usedSignatures){
  const MAX_TRY = 40;
  for(let attempt=0; attempt<MAX_TRY; attempt++){
    const scope = {};
    template.variables.forEach(v=>{
      const lo = Math.ceil(v.min), hi = Math.floor(v.max);
      scope[v.name] = lo + Math.floor(Math.random()*(hi-lo+1));
    });
    const sig = template.id+':'+JSON.stringify(scope);
    if(usedSignatures.has(sig)) continue;
    // evaluate all option expressions
    const values = template.optionExprs.map(e=>safeEval(subst(e,scope).replace(/\{(\w+)\}/g,''), scope) ?? safeEval(e, scope));
    if(values.some(v=>v===null)) continue; // invalid -> retry
    const uniqueVals = new Set(values.map(v=>v.toString()));
    if(uniqueVals.size !== values.length) continue; // duplicate options -> retry
    usedSignatures.add(sig);
    const stemText = subst(template.stem, scope);
    // shuffle options, tracking correct index
    const idxArr = values.map((v,i)=>i);
    for(let i=idxArr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idxArr[i],idxArr[j]]=[idxArr[j],idxArr[i]]; }
    const shuffledOptions = idxArr.map(i=>values[i]);
    const newCorrectIndex = idxArr.indexOf(template.correctIndex);
    return {
      templateId: template.id,
      chapterId: template.chapterId,
      stem: stemText,
      options: shuffledOptions.map(v=>String(v)),
      correctIndex: newCorrectIndex,
      explanation: template.explanation||''
    };
  }
  return null; // could not generate a valid variation
}

  <div id="custom-fields" style="display:none; margin-bottom:20px;">
    <div class="field-row">
      <div class="field"><label>প্রশ্নসংখ্যা</label><input id="custom-n" type="number" value="20" min="1"></div>
      <div class="field"><label>সময় (মিনিট)</label><input id="custom-t" type="number" value="20" min="1"></div>
    </div>
  </div>
  <h3 style="margin-bottom:10px; font-size:1rem;">অধ্যায় নির্বাচন করুন</h3>
  ${DB.groups.length===0 ? '<div class="empty-hint">প্রথমে ডেটা সেকশনে গিয়ে প্রশ্ন যোগ করুন।</div>' : DB.groups.map(g=>{
    const chapters = DB.chapters.filter(c=>c.groupId===g.id);
    return `<div class="group-card open">
      <div class="group-head">
        <div class="group-head-left">
          <input type="checkbox" class="select-check" checked onchange="toggleGroupSelect('${g.id}', this.checked)">
          <div class="group-title">${esc(g.name)}</div>
        </div>
        <div class="group-meta">${chapters.length} অধ্যায়</div>
      </div>
      <div class="group-body" style="max-height:2000px;">
        ${chapters.map(c=>{
          const cnt = DB.templates.filter(t=>t.chapterId===c.id).length;
          return `<div class="chapter-row">
            <div style="display:flex; align-items:center; gap:12px;">
              <input type="checkbox" class="select-check chap-check" data-chapter="${c.id}" checked onchange="toggleChapterSelect()">
              <div><div class="chapter-name">${esc(c.name)}</div><div class="chapter-count">${cnt} টি প্রশ্ন</div></div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('')}
  <button class="btn btn-gold btn-block" style="margin-top:10px;" onclick="beginExam()">পরীক্ষা শুরু করুন</button>
  `;
}
function pickPreset(i){
  setupSelection.preset = PRESETS[i]; setupSelection.custom=false;
  document.querySelectorAll('.preset').forEach(p=>p.classList.remove('active'));
  document.querySelector(`.preset[data-i="${i}"]`).classList.add('active');
  document.getElementById('custom-fields').style.display='none';
}
function pickCustom(){
  setupSelection.custom = true;
  document.querySelectorAll('.preset').forEach(p=>p.classList.remove('active'));
  document.getElementById('preset-custom').classList.add('active');
  document.getElementById('custom-fields').style.display='block';
}
function toggleGroupSelect(groupId, checked){
  DB.chapters.filter(c=>c.groupId===groupId).forEach(c=>{
    const el = document.querySelector(`.chap-check[data-chapter="${c.id}"]`);
    if(el) el.checked = checked;
  });
}
function toggleChapterSelect(){ /* no-op, read at submit time */ }

async function beginExam(weakChapterIds){
  let chapterIds;
  if(weakChapterIds){ chapterIds = weakChapterIds; }
  else {
    chapterIds = [...document.querySelectorAll('.chap-check:checked')].map(x=>x.dataset.chapter);
  }
  if(chapterIds.length===0) return toast('অন্তত একটি অধ্যায় নির্বাচন করুন');
  const pool = DB.templates.filter(t=>chapterIds.includes(t.chapterId));
  if(pool.length===0) return toast('নির্বাচিত অধ্যায়ে কোনো প্রশ্ন নেই');

  let n, durationSec;
  if(weakChapterIds){ n = Math.min(20, pool.length); durationSec = n*45; }
  else if(setupSelection.custom){
    n = parseInt(document.getElementById('custom-n').value)||10;
    durationSec = (parseInt(document.getElementById('custom-t').value)||10)*60;
  } else { n = setupSelection.preset.n; durationSec = setupSelection.preset.t*60; }

  // build randomized template order (repeat pool if needed), generate valid variations
  const usedSig = new Set();
  const questions = [];
  let shuffledPool = [...pool];
  let guard = 0;
  while(questions.length < n && guard < n*8){
    guard++;
    if(shuffledPool.length===0) shuffledPool = [...pool];
    const idx = Math.floor(Math.random()*shuffledPool.length);
    const tpl = shuffledPool.splice(idx,1)[0];
    const q = generateVariation(tpl, usedSig);
    if(q) questions.push(q);
  }
  if(questions.length===0) return toast('বৈধ প্রশ্ন তৈরি করা যায়নি — প্রশ্ন প্যাটার্ন পরীক্ষা করুন');

  currentExam = {
    id: uid(),
    startedAt: Date.now(),
    durationSec,
    questions,
    answers: {}, // qIndex -> optionIndex
    status: 'active'
  };
  await saveExam();
  nav('exam');
}

/* ============================= EXAM RUNNER ============================= */
let examTick = null;
async function viewExam(){
  if(!currentExam){ nav('examsetup'); return ''; }
  return renderExamBody();
}
function renderExamBody(){
  const total = currentExam.questions.length;
  const answered = Object.keys(currentExam.answers).length;
  const idx = currentExam._focusIdx || 0;
  const q = currentExam.questions[idx];
  const remaining = examRemainingSecs();
  return `
  <div class="watermark">${DB.profile.name}</div>
  <div class="exam-top">
    <div style="font-size:.85rem; color:var(--ink-soft);">উত্তর দেওয়া হয়েছে: ${answered}/${total}</div>
    <div class="timer ${remaining<60?'low':''}" id="exam-timer">${fmtSecs(remaining)}</div>
  </div>
  <div class="progress-bar"><div class="progress-fill" style="width:${(answered/total*100)}%;"></div></div>
  <div class="q-wrap">
    <div class="q-num">প্রশ্ন ${idx+1} / ${total}</div>
    <div class="q-stem">${renderMath(q.stem)}</div>
    ${q.options.map((opt,i)=>{
      const selected = currentExam.answers[idx]===i;
      const locked = currentExam.answers[idx]!==undefined;
      return `<div class="opt ${selected?'selected':''} ${locked?'locked':''}" onclick="${locked?'':'selectAnswer('+idx+','+i+')'}">
        <div class="radio-dot"><div class="fill"></div></div>
        <div class="opt-text">${renderMath(opt)}</div>
      </div>`;
    }).join('')}
  </div>
  <div class="exam-nav">
    <button class="btn" onclick="examGo(${idx-1})" ${idx===0?'disabled style="opacity:.4"':''}>← আগের</button>
    <div class="btn-row">
      ${idx<total-1 ? `<button class="btn btn-primary" onclick="examGo(${idx+1})">পরবর্তী →</button>` : ''}
      <button class="btn btn-gold" onclick="confirmSubmitExam()">জমা দিন</button>
    </div>
  </div>`;
}
function examRemainingSecs(){
  const elapsed = (Date.now() - currentExam.startedAt)/1000;
  return Math.max(0, currentExam.durationSec - elapsed);
}
async function selectAnswer(qIdx, optIdx){
  if(currentExam.answers[qIdx]!==undefined) return;
  currentExam.answers[qIdx] = optIdx;
  await saveExam();
  document.getElementById('view').innerHTML = renderExamBody();
}
function examGo(idx){
  if(idx<0 || idx>=currentExam.questions.length) return;
  currentExam._focusIdx = idx;
  document.getElementById('view').innerHTML = renderExamBody();
}
function startExamTimerLoop(){
  clearInterval(examTick);
  examTick = setInterval(()=>{
    if(!currentExam || location.hash !== '#/exam'){ clearInterval(examTick); return; }
    const remaining = examRemainingSecs();
    const t = document.getElementById('exam-timer');
    if(t){ t.textContent = fmtSecs(remaining); t.classList.toggle('low', remaining<60); }
    if(remaining<=0){ clearInterval(examTick); submitExam(true); }
  }, 1000);
}
function confirmSubmitExam(){
  const total = currentExam.questions.length;
  const answered = Object.keys(currentExam.answers).length;
  const unans = total-answered;
  if(confirm(`আপনি ${answered}/${total} টি প্রশ্নের উত্তর দিয়েছেন${unans?` (${unans}টি অনুত্তরিত)`:''}। জমা দিতে চান?`)){
    clearInterval(examTick);
    submitExam(false);
  }
}
async function submitExam(auto){
  let correct=0, wrong=0, unanswered=0;
  const breakdown = currentExam.questions.map((q,i)=>{
    const ans = currentExam.answers[i];
    let status;
    if(ans===undefined){ unanswered++; status='skip'; }
    else if(ans===q.correctIndex){ correct++; status='correct'; }
    else { wrong++; status='wrong'; }
    return {stem:q.stem, options:q.options, correctIndex:q.correctIndex, userAnswer:ans, status, explanation:q.explanation, chapterId:q.chapterId, templateId:q.templateId};
  });
  const score = Math.round((correct - wrong*0.25)*100)/100;
  const total = currentExam.questions.length;
  const timeUsed = Math.round((Date.now()-currentExam.startedAt)/1000);
  const record = {
    id: currentExam.id, date: Date.now(), total, correct, wrong, unanswered, score,
    percentage: Math.round((score/total)*1000)/10,
    accuracy: (correct+wrong)>0 ? Math.round((correct/(correct+wrong))*1000)/10 : 0,
    timeUsedSec: timeUsed, breakdown, auto
  };
  DB.history.push(record);
  await saveHistory();
  await clearExam();
  nav('result-'+record.id);
}

/* result/review routes need param access */
window.addEventListener('hashchange', ()=>{
  const h = location.hash.replace('#/','');
  if(h.startsWith('result-')) document.getElementById('view').innerHTML = viewResult(h.split('-')[1]);
  if(h.startsWith('review-')) document.getElementById('view').innerHTML = viewReview(h.split('-')[1]);
});
function viewResult(id){
  const r = DB.history.find(x=>x.id===id);
  if(!r) return '<div class="empty-hint">ফলাফল পাওয়া যায়নি।</div>';
  return `
  <div class="score-hero">
    <div class="score-num">${r.score}</div>
    <div class="score-label">স্কোর (মোট ${r.total} এর মধ্যে) · ${r.percentage}%</div>
  </div>
  <div class="stat-grid">
    <div class="stat"><div class="v correct">${r.correct}</div><div class="l">সঠিক</div></div>
    <div class="stat"><div class="v wrong">${r.wrong}</div><div class="l">ভুল</div></div>
    <div class="stat"><div class="v">${r.unanswered}</div><div class="l">অনুত্তরিত</div></div>
    <div class="stat"><div class="v">${r.accuracy}%</div><div class="l">নির্ভুলতা</div></div>
  </div>
  <div class="stat" style="margin-bottom:20px;"><div class="v">${fmtSecs(r.timeUsedSec)}</div><div class="l">ব্যবহৃত সময়</div></div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="nav('review-${r.id}')">উত্তরপত্র পর্যালোচনা</button>
    <button class="btn" onclick="nav('dashboard')">ড্যাশবোর্ডে ফিরুন</button>
  </div>`;
}
function viewReview(id){
  const r = DB.history.find(x=>x.id===id);
  if(!r) return '<div class="empty-hint">পাওয়া যায়নি।</div>';
  return `
  <h2 class="section-title">উত্তরপত্র পর্যালোচনা</h2>
  <p class="section-sub">${r.correct} সঠিক · ${r.wrong} ভুল · ${r.unanswered} অনুত্তরিত</p>
  ${r.breakdown.map((b,i)=>`
    <div class="review-item">
      <span class="review-tag ${b.status==='correct'?'tag-correct':b.status==='wrong'?'tag-wrong':'tag-skip'}">
        ${b.status==='correct'?'✓ সঠিক':b.status==='wrong'?'✕ ভুল':'— অনুত্তরিত'}
      </span>
      <div class="q-num">প্রশ্ন ${i+1}</div>
      <div class="q-stem" style="font-size:.98rem;">${renderMath(b.stem)}</div>
      ${b.options.map((o,oi)=>{
        let cls='';
        if(oi===b.correctIndex) cls='is-correct';
        else if(oi===b.userAnswer) cls='is-wrong';
        return `<div class="review-opt ${cls}">${renderMath(o)} ${oi===b.correctIndex?' ✓':(oi===b.userAnswer?' ✕':'')}</div>`;
      }).join('')}
      ${b.explanation?`<div class="hint" style="margin-top:8px;">ব্যাখ্যা: ${renderMath(b.explanation)}</div>`:''}
    </div>`).join('')}
  <button class="btn" onclick="nav('performance')">পারফরম্যান্সে ফিরুন</button>`;
}

/* ============================= PERFORMANCE ============================= */
function viewPerformance(){
  if(DB.history.length===0){
    return `<h2 class="section-title">পারফরম্যান্স</h2><div class="empty-hint">এখনো কোনো পরীক্ষা সম্পন্ন হয়নি।</div>`;
  }
  const hist = [...DB.history].sort((a,b)=>a.date-b.date);
  const now = Date.now(), week = 7*24*3600*1000;
  const thisWeek = hist.filter(h=>now-h.date < week);
  const lastWeek = hist.filter(h=>now-h.date >= week && now-h.date < 2*week);
  const avg = arr => arr.length? Math.round(arr.reduce((s,h)=>s+h.percentage,0)/arr.length*10)/10 : null;
  const twAvg = avg(thisWeek), lwAvg = avg(lastWeek);
  const delta = (twAvg!==null && lwAvg!==null) ? Math.round((twAvg-lwAvg)*10)/10 : null;

  // weak chapters: aggregate wrong counts by chapterId
  const chapStats = {};
  hist.forEach(h=>h.breakdown.forEach(b=>{
    chapStats[b.chapterId] = chapStats[b.chapterId] || {wrong:0, total:0};
    chapStats[b.chapterId].total++;
    if(b.status==='wrong') chapStats[b.chapterId].wrong++;
  }));
  const weakList = Object.entries(chapStats)
    .map(([cid,s])=>({cid, rate: s.wrong/s.total, ...s}))
    .filter(x=>x.total>=3 && x.rate>=0.35)
    .sort((a,b)=>b.rate-a.rate).slice(0,6);

  const maxPct = Math.max(...hist.map(h=>h.percentage), 100);
  const barsHtml = hist.slice(-12).map(h=>{
    const height = Math.max(4, (h.percentage/maxPct)*90);
    return `<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="font-size:.68rem; color:var(--ink-soft);">${h.percentage}%</div>
      <div style="width:60%; height:${height}px; background:var(--brass); border-radius:4px 4px 0 0;"></div>
    </div>`;
  }).join('');

  return `
  <h2 class="section-title">পারফরম্যান্স</h2>
  <div class="perf-summary">
    <div class="perf-card"><div class="v">${twAvg??'—'}${twAvg!==null?'%':''}</div><div class="l">এই সপ্তাহ</div></div>
    <div class="perf-card"><div class="v">${lwAvg??'—'}${lwAvg!==null?'%':''}</div><div class="l">গত সপ্তাহ</div></div>
    <div class="perf-card"><div class="v ${delta>0?'up':delta<0?'down':''}">${delta===null?'—':(delta>0?'+':'')+delta+'%'}</div><div class="l">পরিবর্তন</div></div>
  </div>
  <div class="chart-wrap">
    <div style="display:flex; align-items:flex-end; gap:8px; height:110px;">${barsHtml}</div>
  </div>
  ${weakList.length? `
  <h3 style="margin-bottom:10px; font-size:1rem;">দুর্বল অধ্যায়সমূহ</h3>
  ${weakList.map(w=>{
    const chap = DB.chapters.find(c=>c.id===w.cid);
    return `<div class="weak-row"><span>${esc(chap?chap.name:'—')}</span><span>${Math.round(w.rate*100)}% ভুল</span></div>`;
  }).join('')}
  <button class="btn btn-gold" style="margin:14px 0 26px;" onclick="practiceWeak(${JSON.stringify(weakList.map(w=>w.cid))})">দুর্বল জায়গা প্র্যাকটিস করুন</button>
  ` : ''}
  <h3 style="margin-bottom:10px; font-size:1rem;">পরীক্ষার ইতিহাস</h3>
  ${[...hist].reverse().map(h=>`
    <div class="hist-item" onclick="nav('result-${h.id}')" style="cursor:pointer;">
      <div class="l">${fmtDate(h.date)} · ${h.total} প্রশ্ন</div>
      <div class="r">${h.percentage}%</div>
    </div>`).join('')}
  `;
}
window.practiceWeak = function(cidsJson){
  const cids = typeof cidsJson==='string' ? JSON.parse(cidsJson) : cidsJson;
  beginExam(cids);
};

/* ============================= ANTI-CHEAT (light, exam view only) ============================= */
document.addEventListener('contextmenu', e=>{ if(location.hash==='#/exam') e.preventDefault(); });
document.addEventListener('copy', e=>{ if(location.hash==='#/exam') e.preventDefault(); });
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && location.hash==='#/exam') toast('⚠ ট্যাব পরিবর্তন শনাক্ত হয়েছে');
});

/* ============================= BOOT ============================= */
async function boot(){
  await loadDB();
  setTimeout(()=>{ document.getElementById('intro').classList.add('hide'); }, 2200);
  setTimeout(async ()=>{
    if(DB.profile){
      enterApp();
      if(currentExam && currentExam.status==='active'){
        if(examRemainingSecs()<=0){ await submitExam(true); }
        else { nav('exam'); }
      }
    } else {
      document.getElementById('login-screen').style.display='flex';
    }
  }, 2300);
}
boot();
