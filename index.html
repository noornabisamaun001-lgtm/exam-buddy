<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>দিকনির্ণয় — ভর্তি প্রস্তুতি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{
  --ink:#1B2430; --ink-soft:#3A4453;
  --parchment:#F7F4EC; --paper:#FFFFFF;
  --brass:#B8892B; --brass-dim:#E7D5A9;
  --teal:#2F6F5E; --clay:#B5533C;
  --line:#E4DFD1;
  --shadow: 0 1px 2px rgba(27,36,48,.06), 0 6px 20px rgba(27,36,48,.05);
  --radius: 14px;
  font-size: 16px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Hind Siliguri','Inter',sans-serif;
  background:var(--parchment); color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,.serif{font-family:'Source Serif 4', serif;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

/* ---------- Compass intro ---------- */
#intro{
  position:fixed; inset:0; background:var(--ink); z-index:999;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  transition:opacity .7s ease, visibility .7s ease;
}
#intro.hide{opacity:0; visibility:hidden; pointer-events:none;}
.compass{width:120px; height:120px; position:relative;}
.compass svg{width:100%; height:100%;}
.needle{transform-origin:60px 60px; animation: settle 2.1s cubic-bezier(.22,1,.36,1) forwards;}
@keyframes settle{
  0%{transform:rotate(390deg); opacity:0;}
  35%{opacity:1;}
  60%{transform:rotate(-18deg);}
  80%{transform:rotate(6deg);}
  100%{transform:rotate(0deg);}
}
.intro-word{color:var(--brass-dim); font-family:'Source Serif 4',serif; font-size:1.05rem; letter-spacing:.04em; margin-top:22px; opacity:0; animation:fadeUp 1s ease forwards; animation-delay:1.1s;}
@keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* ---------- Login ---------- */
#login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
.login-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:40px 36px; max-width:380px; width:100%; text-align:center;}
.login-mark{width:46px; height:46px; margin:0 auto 18px;}
.login-card h1{font-size:1.5rem; margin-bottom:6px;}
.login-card p{color:var(--ink-soft); font-size:.92rem; margin-bottom:26px; line-height:1.55;}
.g-btn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:13px 16px; border:1px solid var(--line); border-radius:10px; background:var(--paper); font-size:.95rem; font-weight:600; color:var(--ink); transition:border-color .2s, box-shadow .2s;}
.g-btn:hover{border-color:var(--brass); box-shadow:0 2px 10px rgba(184,137,43,.15);}
.login-note{margin-top:16px; font-size:.78rem; color:#9A9384;}

/* ---------- App shell ---------- */
#app{min-height:100vh; display:none;}
#app.show{display:block; animation:fadeIn .5s ease;}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.topbar{position:sticky; top:0; z-index:20; background:rgba(247,244,236,.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:14px 22px; gap:10px; flex-wrap:wrap;}
body.exam-mode .topbar{display:none;}
.brand{display:flex; align-items:center; gap:10px; font-family:'Source Serif 4',serif; font-weight:600; font-size:1.05rem;}
.brand svg{width:26px; height:26px;}
.topbar-right{display:flex; align-items:center; gap:14px; font-size:.85rem; color:var(--ink-soft);}
.back-btn{background:none; border:none; color:var(--ink-soft); font-size:.9rem; display:flex; align-items:center; gap:6px;}
.back-btn:hover{color:var(--brass);}
main{max-width:960px; margin:0 auto; padding:28px 20px 80px;}
body.exam-mode main{padding:0;}
.view-enter{animation:slideUp .4s cubic-bezier(.22,1,.36,1);}
@keyframes slideUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

.section-title{font-size:1.4rem; margin-bottom:4px;}
.section-sub{color:var(--ink-soft); font-size:.9rem; margin-bottom:22px;}
.kbd-hint{display:inline-block; font-size:.72rem; color:var(--ink-soft); background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-family:'Inter',sans-serif; margin-left:4px;}

/* Dashboard */
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:8px;}
@media(max-width:640px){.tiles{grid-template-columns:1fr;}}
.tile{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:26px 22px; box-shadow:var(--shadow); transition:transform .25s ease, box-shadow .25s ease; text-align:left;}
.tile:hover{transform:translateY(-3px); box-shadow:0 10px 26px rgba(27,36,48,.09);}
.tile .icon{width:30px; height:30px; margin-bottom:14px; color:var(--brass);}
.tile h3{font-size:1.08rem; margin-bottom:5px;}
.tile p{color:var(--ink-soft); font-size:.85rem; line-height:1.5;}

/* Cards / tree */
.group-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:14px; box-shadow:var(--shadow); overflow:hidden;}
.group-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; cursor:pointer; gap:8px; flex-wrap:wrap;}
.group-head-left{display:flex; align-items:center; gap:10px;}
.chev{width:16px; height:16px; transition:transform .25s ease; color:var(--ink-soft);}
.group-card.open .chev{transform:rotate(90deg);}
.group-title{font-weight:600; font-size:1rem;}
.group-meta{color:var(--ink-soft); font-size:.78rem;}
.group-body{max-height:0; overflow:hidden; transition:max-height .35s ease;}
.group-card.open .group-body{max-height:6000px;}
.chapter-row{display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--line); flex-wrap:wrap; gap:8px;}
.chapter-row:hover{background:#FBF9F3;}
.chapter-name{font-size:.93rem; font-weight:500;}
.chapter-count{font-size:.78rem; color:var(--ink-soft);}
.type-badge{display:inline-block; font-size:.68rem; font-weight:700; padding:1px 8px; border-radius:10px; margin-left:6px; vertical-align:middle;}
.type-numeric{background:#E4F1EC; color:var(--teal);}
.type-concept{background:#EFE3F3; color:#6A3E86;}
.row-actions{display:flex; gap:6px; flex-wrap:wrap;}
.icon-btn{width:30px; height:30px; border:none; background:none; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); transition:background .2s,color .2s; flex-shrink:0;}
.icon-btn:hover{background:var(--brass-dim); color:var(--ink);}
.icon-btn svg{width:15px; height:15px;}
.icon-btn.ai-btn{color:var(--brass);}
.icon-btn.ai-btn:hover{background:var(--brass); color:#fff;}
.add-row{padding:10px 18px; border-top:1px solid var(--line);}
.link-btn{background:none; border:none; color:var(--brass); font-weight:600; font-size:.85rem;}
.link-btn:hover{text-decoration:underline;}
.empty-hint{color:var(--ink-soft); font-size:.85rem; padding:24px 4px;}

/* Buttons */
.btn{padding:11px 20px; border-radius:10px; border:1px solid var(--line); background:var(--paper); font-size:.9rem; font-weight:600; color:var(--ink); transition:all .2s;}
.btn:hover{border-color:var(--brass);}
.btn-primary{background:var(--ink); color:#fff; border-color:var(--ink);}
.btn-primary:hover{background:#0f151d;}
.btn-gold{background:var(--brass); color:#fff; border-color:var(--brass);}
.btn-gold:hover{background:#a37820;}
.btn-danger{color:var(--clay); border-color:var(--clay);}
.btn-danger:hover{background:#FBEAE5;}
.btn-block{width:100%;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap;}
.btn[disabled]{opacity:.5; cursor:not-allowed;}

/* Modal */
.overlay{position:fixed; inset:0; background:rgba(27,36,48,.45); display:flex; align-items:center; justify-content:center; z-index:200; padding:16px; opacity:0; visibility:hidden; transition:opacity .25s ease, visibility .25s ease;}
.overlay.show{opacity:1; visibility:visible;}
.modal{background:var(--paper); border-radius:var(--radius); padding:26px; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.25); transform:scale(.96) translateY(6px); transition:transform .25s ease;}
.overlay.show .modal{transform:scale(1) translateY(0);}
.modal h3{margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:.8rem; color:var(--ink-soft); margin-bottom:6px; font-weight:600;}
.field input,.field select,.field textarea{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:.92rem; background:#FDFCF9;}
.field textarea{min-height:70px; resize:vertical;}
.field-row{display:flex; gap:10px;}
.field-row>.field{flex:1;}
.opt-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.opt-row input[type=text]{flex:1;}
.opt-row input[type=radio]{width:18px; height:18px; accent-color:var(--teal); flex-shrink:0;}
.hint{font-size:.76rem; color:#9A9384; margin-top:4px;}

/* Unified AI input box */
.unified-input{border:1.5px solid var(--line); border-radius:16px; background:#FDFCF9; padding:8px; margin-bottom:6px;}
.unified-input:focus-within{border-color:var(--brass);}
.attach-preview{display:flex; align-items:center; gap:8px; padding:6px 8px 10px;}
.attach-preview img{width:52px; height:52px; object-fit:cover; border-radius:8px; border:1px solid var(--line);}
.attach-preview button{background:var(--clay); color:#fff; border:none; width:22px; height:22px; border-radius:50%; font-size:.75rem; line-height:1;}
.input-row{display:flex; align-items:flex-end; gap:6px;}
.input-icon-btn{flex-shrink:0; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--paper); display:flex; align-items:center; justify-content:center; font-size:1.05rem; transition:background .2s, border-color .2s;}
.input-icon-btn:hover{border-color:var(--brass); background:var(--brass-dim);}
.input-icon-btn.recording{background:var(--clay); border-color:var(--clay); color:#fff; animation:pulseRec 1.2s infinite;}
@keyframes pulseRec{0%,100%{opacity:1;}50%{opacity:.6;}}
#ai-raw-text{flex:1; border:none; background:transparent; resize:none; padding:9px 6px; font-size:.94rem; max-height:220px; min-height:38px; line-height:1.4; outline:none;}
.input-send-btn{flex-shrink:0; width:40px; height:40px; border-radius:50%; border:none; background:var(--brass); color:#fff; font-size:1.1rem; display:flex; align-items:center; justify-content:center; transition:background .2s, transform .15s;}
.input-send-btn:hover{background:#a37820; transform:scale(1.05);}
.input-send-btn[disabled]{background:#C9C2AF; cursor:not-allowed; transform:none;}
.api-key-banner{display:flex; align-items:center; justify-content:space-between; gap:10px; background:#FBF3EA; border:1px solid var(--brass-dim); border-radius:10px; padding:10px 14px; font-size:.82rem; margin-bottom:12px; flex-wrap:wrap;}

/* Exam setup */
.preset-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px;}
@media(max-width:640px){.preset-grid{grid-template-columns:repeat(2,1fr);}}
.preset{border:1px solid var(--line); border-radius:12px; padding:16px 12px; text-align:center; background:var(--paper); transition:all .2s;}
.preset.active,.preset:hover{border-color:var(--brass); box-shadow:0 4px 14px rgba(184,137,43,.15);}
.preset .n{font-size:1.3rem; font-weight:700; font-family:'Source Serif 4',serif;}
.preset .t{font-size:.76rem; color:var(--ink-soft);}
.select-check{width:19px; height:19px; accent-color:var(--brass); flex-shrink:0;}

/* Exam runner — sticky header, natural document scroll */
.exam-header-fixed{
  position:sticky; top:0; z-index:50;
  width:100vw; margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw);
}
.exam-top{display:flex; align-items:center; justify-content:space-between; padding:14px 20px; background:var(--paper); border-bottom:1px solid var(--line); gap:10px; flex-wrap:wrap;}
.exam-top-info{font-size:.85rem; color:var(--ink-soft);}
.exam-exit-btn{background:none; border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:.78rem; color:var(--ink-soft);}
.exam-exit-btn:hover{border-color:var(--clay); color:var(--clay);}
.timer{font-family:'Source Serif 4',serif; font-size:1.15rem; font-weight:600; padding:6px 14px; border-radius:8px; background:var(--parchment); border:1px solid var(--line);}
.timer.low{color:var(--clay); border-color:var(--clay); background:#FBEAE5;}
.progress-bar{height:4px; background:var(--line);}
.progress-fill{height:100%; background:var(--brass); transition:width .3s ease;}
.q-wrap{max-width:680px; margin:0 auto; padding:22px 20px calc(140px + env(safe-area-inset-bottom));}
.q-num{color:var(--ink-soft); font-size:.85rem; margin-bottom:10px;}
.q-stem{font-size:1.08rem; line-height:1.7; margin-bottom:22px;}
.q-fig{max-width:100%; margin:0 0 18px; border-radius:8px; border:1px solid var(--line);}
.opt{display:flex; align-items:center; gap:14px; padding:14px 16px; border:1.5px solid var(--line); border-radius:12px; margin-bottom:10px; background:var(--paper); transition:border-color .18s, background .18s;}
.opt:hover{border-color:var(--brass-dim);}
.opt.selected{border-color:var(--ink); background:#F1EEE4;}
.opt.locked{cursor:default;}
.opt-key{font-size:.72rem; color:var(--ink-soft); border:1px solid var(--line); border-radius:5px; padding:0 5px; flex-shrink:0;}
.radio-dot{width:20px; height:20px; border-radius:50%; border:2px solid #C9C2AF; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.opt.selected .radio-dot{border-color:var(--ink);}
.radio-dot .fill{width:10px; height:10px; border-radius:50%; background:var(--ink); display:none;}
.opt.selected .radio-dot .fill{display:block;}
.opt-text{font-size:.96rem;}
.exam-nav{position:fixed; bottom:0; left:0; right:0; background:var(--paper); border-top:1px solid var(--line); padding:12px 20px calc(12px + env(safe-area-inset-bottom)); display:flex; justify-content:space-between; gap:10px; z-index:45; flex-wrap:wrap;}

/* Result */
.score-hero{text-align:center; padding:30px 0 10px;}
.score-num{font-family:'Source Serif 4',serif; font-size:3.4rem; font-weight:700; color:var(--ink);}
.score-label{color:var(--ink-soft); font-size:.9rem;}
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:26px 0;}
@media(max-width:640px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px; text-align:center;}
.stat .v{font-size:1.25rem; font-weight:700; font-family:'Source Serif 4',serif;}
.stat .l{font-size:.72rem; color:var(--ink-soft); margin-top:2px;}
.v.correct{color:var(--teal);} .v.wrong{color:var(--clay);}

/* Review */
.review-item{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:12px;}
.review-tag{display:inline-flex; align-items:center; gap:6px; font-size:.76rem; font-weight:700; padding:3px 10px; border-radius:20px; margin-bottom:10px;}
.tag-correct{background:#E4F1EC; color:var(--teal);}
.tag-wrong{background:#FBEAE5; color:var(--clay);}
.tag-skip{background:#EFEAE0; color:var(--ink-soft);}
.review-opt{padding:8px 12px; border-radius:8px; font-size:.88rem; margin-bottom:6px; border:1px solid var(--line);}
.review-opt.is-correct{border-color:var(--teal); background:#F1F8F5;}
.review-opt.is-wrong{border-color:var(--clay); background:#FDF2EF;}

/* Performance */
.perf-summary{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px;}
@media(max-width:640px){.perf-summary{grid-template-columns:1fr;}}
.perf-card{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:16px 18px;}
.perf-card .v{font-size:1.4rem; font-weight:700; font-family:'Source Serif 4',serif;}
.perf-card .l{font-size:.78rem; color:var(--ink-soft);}
.perf-card .delta{font-size:.8rem; font-weight:600; margin-top:4px;}
.up{color:var(--teal);} .down{color:var(--clay);}
.chart-wrap{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:22px;}
.hist-item{display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; background:var(--paper);}
.hist-item .l{font-size:.85rem; color:var(--ink-soft);}
.hist-item .r{font-weight:700; font-family:'Source Serif 4',serif;}
.weak-row{display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-radius:8px; background:#FBF3EA; margin-bottom:6px; font-size:.87rem;}

/* Toast / confirm */
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:12px 20px; border-radius:10px; font-size:.87rem; opacity:0; visibility:hidden; transition:all .3s ease; z-index:300; max-width:90vw; text-align:center;}
.toast.show{opacity:1; visibility:visible; transform:translateX(-50%) translateY(0);}

/* Custom confirm modal (replaces browser window.confirm) */
.confirm-overlay{position:fixed; inset:0; background:rgba(27,36,48,.5); display:flex; align-items:center; justify-content:center; z-index:400; padding:16px; opacity:0; visibility:hidden; transition:opacity .2s ease, visibility .2s ease;}
.confirm-overlay.show{opacity:1; visibility:visible;}
.confirm-box{background:var(--paper); border-radius:var(--radius); padding:24px; width:100%; max-width:380px; box-shadow:0 20px 60px rgba(0,0,0,.28); text-align:center; transform:scale(.94) translateY(6px); transition:transform .22s ease;}
.confirm-overlay.show .confirm-box{transform:scale(1) translateY(0);}
.confirm-icon{width:44px; height:44px; border-radius:50%; margin:0 auto 14px; display:flex; align-items:center; justify-content:center; background:var(--brass-dim); color:var(--brass);}
.confirm-icon.danger{background:#FBEAE5; color:var(--clay);}
.confirm-icon svg{width:22px; height:22px;}
.confirm-title{font-family:'Source Serif 4',serif; font-size:1.12rem; margin-bottom:6px;}
.confirm-msg{color:var(--ink-soft); font-size:.88rem; line-height:1.55; margin-bottom:20px;}
.confirm-btn-row{display:flex; gap:10px;}
.confirm-btn-row .btn{flex:1;}
.watermark{position:fixed; inset:0; pointer-events:none; z-index:1; opacity:.035; display:flex; align-items:center; justify-content:center; font-size:3rem; font-family:'Source Serif 4',serif; transform:rotate(-25deg); user-select:none;}
.katex{font-size:1.02em;}
::selection{background:var(--brass-dim);}
</style>
</head>
<body>

<div id="intro">
  <div class="compass">
    <svg viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="52" fill="none" stroke="#E7D5A9" stroke-width="1.4" opacity=".5"/>
      <circle cx="60" cy="60" r="38" fill="none" stroke="#E7D5A9" stroke-width="1" opacity=".35"/>
      <g class="needle">
        <polygon points="60,20 67,60 60,68 53,60" fill="#B8892B"/>
        <polygon points="60,100 67,60 60,52 53,60" fill="#5b4a2c"/>
      </g>
      <circle cx="60" cy="60" r="4" fill="#F7F4EC"/>
    </svg>
  </div>
  <div class="intro-word">দিকনির্ণয়</div>
</div>

<div id="login-screen" style="display:none;">
  <div class="login-card">
    <div class="login-mark">
      <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="none" stroke="#B8892B" stroke-width="1.6"/><polygon points="24,10 27,24 24,28 21,24" fill="#1B2430"/><polygon points="24,38 27,24 24,20 21,24" fill="#B8892B"/></svg>
    </div>
    <h1>দিকনির্ণয়</h1>
    <p>আপনার ব্যক্তিগত ভর্তি প্রস্তুতির কমান্ড সেন্টার। শুরু করতে সাইন ইন করুন।</p>
    <button class="g-btn" id="google-btn">

function renderMath(text){
  if(!text) return '';
  const esc0 = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let out = '', i = 0;
  while(i < text.length){
    if(text[i] === '$'){
      const end = text.indexOf('$', i+1);
      if(end === -1){ out += esc0(text.slice(i)); break; }
      const expr = text.slice(i+1, end);
      try{ out += katex.renderToString(expr, {throwOnError:false}); }
      catch(e){ out += esc0(expr); }
      i = end+1;
    } else {
      let next = text.indexOf('$', i);
      if(next === -1) next = text.length;
      out += esc0(text.slice(i, next));
      i = next;
    }
  }
  return out;
}

function showConfirm(message, opts){
  opts = opts || {};
  const title = opts.title || 'নিশ্চিত করুন';
  const confirmLabel = opts.confirmLabel || 'হ্যাঁ, নিশ্চিত';
  const cancelLabel = opts.cancelLabel || 'বাতিল';
  const danger = !!opts.danger;
  return new Promise(resolve=>{
    const overlay = document.getElementById('confirm-overlay');
    const box = document.getElementById('confirm-box');
    box.innerHTML = `
      <div class="confirm-icon ${danger?'danger':''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${danger?'<path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/>':'<path d="M12 8v4M12 16h.01"/><circle cx="12" cy="12" r="9"/>'}</svg>

      <div class="confirm-msg">${esc(message)}</div>
      <div class="confirm-btn-row">
        <button class="btn" id="confirm-cancel-btn">${esc(cancelLabel)}</button>
        <button class="btn ${danger?'btn-danger':'btn-gold'}" id="confirm-ok-btn" style="${danger?'background:var(--clay); color:#fff; border-color:var(--clay);':''}">${esc(confirmLabel)}</button>
      </div>`;
    overlay.classList.add('show');
    function cleanup(result){
      overlay.classList.remove('show');
      overlay.removeEventListener('click', onOverlayClick);
      document.getElementById('confirm-cancel-btn').removeEventListener('click', onCancel);
      document.getElementById('confirm-ok-btn').removeEventListener('click', onOk);
      resolve(result);
    }
    function onOk(){ cleanup(true); }
    function onCancel(){ cleanup(false); }
    function onOverlayClick(e){ if(e.target.id==='confirm-overlay') cleanup(false); }
    document.getElementById('confirm-ok-btn').addEventListener('click', onOk);
    document.getElementById('confirm-cancel-btn').addEventListener('click', onCancel);
    overlay.addEventListener('click', onOverlayClick);
    setTimeout(()=>document.getElementById('confirm-ok-btn').focus(),50);
  });
}

/* ============================= GEMINI: DYNAMIC MODEL-PROOF API LAYER =============================
   Instead of hardcoding one model name (which breaks the moment Google renames/retires it), we:
   1) Ask Google's own ListModels endpoint which models are currently live and support generateContent.
   2) Score & pick the best candidate (prefers "flash", higher version numbers, avoids vision/embedding-only).
   3) Cache the working model for 24h so we don't re-discover on every call.
   4) On any call, if the cached/chosen model 404s (deprecated), walk a fallback chain and re-cache
      whichever model actually answers — so the app self-heals the next time Google changes something.
================================================================================================= */
const FALLBACK_MODEL_CHAIN = [
  'gemini-2.5-flash',
  'gemini-flash-latest',
  'gemini-2.0-flash',
  'gemini-2.5-flash-lite',
  'gemini-2.5-pro',
  'gemini-1.5-flash-latest',
  'gemini-1.5-flash',
  'gemini-1.5-pro-latest'
];

function scoreModelName(name){
  let s = 0;
  if(/flash/i.test(name)) s += 50;
  if(/latest/i.test(name)) s += 10;
  if(/lite/i.test(name)) s -= 5;
  if(/pro/i.test(name)) s += 15;
  const verMatch = name.match(/(\d+)\.(\d+)/);
  if(verMatch) s += (parseFloat(verMatch[1]+'.'+verMatch[2]) * 10);
  if(/vision|embedding|aqa|gemma|image|tts|native-audio/i.test(name)) s -= 1000;
  return s;
}

async function discoverBestModel(apiKey){
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(apiKey)}`);
  if(!res.ok) throw new Error('মডেল তালিকা আনা যায়নি');
  const data = await res.json();
  const models = (data.models||[])
    .filter(m => (m.supportedGenerationMethods||[]).includes('generateContent'))
    .map(m => (m.name||'').replace('models/',''))
    .filter(n => /gemini/i.test(n));
  if(models.length===0) throw new Error('কোনো ব্যবহারযোগ্য Gemini মডেল পাওয়া যায়নি');
  models.sort((a,b)=>scoreModelName(b)-scoreModelName(a));
  return models[0];
}

async function getActiveModel(apiKey, forceRefresh){
  const userModel = ((await sGet('geminiModel'))||'').trim();
  if(userModel && userModel.toLowerCase() !== 'auto') return userModel; // explicit manual override wins

  const cache = await sGet('modelCache');
  const now = Date.now();
  if(!forceRefresh && cache && cache.model && (now - cache.at) < 24*3600*1000){
    return cache.model;
  }
  try{
    const best = await discoverBestModel(apiKey);
    await sSet('modelCache', {model:best, at:now});
    return best;
  }catch(e){
    return (cache && cache.model) || FALLBACK_MODEL_CHAIN[0];
  }
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

// Any error that means "this particular model/endpoint isn't answering right now"
// (deprecated, overloaded, rate-limited, temporarily down, or transiently mangled
// its own response) — as opposed to a real, non-recoverable error like a bad key.
// The whole point: the user never sees any of this, the app just quietly tries
// the next candidate and returns a normal result.
function isRecoverableModelError(e){
  const status = e.status;
  const msg = (e.message||'').toLowerCase();
  if([404,429,500,502,503,504].includes(status)) return true;
  if(/not found|deprecated|is not supported|overloaded|unavailable|rate limit|quota|resource has been exhausted|try again|internal error|timed? ?out|json আকারে পার্স করা যায়নি|empty_response/i.test(msg)) return true;
  return false;
}

async function callGeminiAPI({text, imageBase64, imageMime}){
  const apiKey = await sGet('geminiApiKey');
  if(!apiKey) throw new Error('NO_API_KEY');

  const parts = [{ text }];
  if(imageBase64){ parts.push({ inline_data: { mime_type: imageMime || 'image/jpeg', data: imageBase64 } }); }
  const body = {
    contents: [{ role: 'user', parts }],
    generationConfig: { temperature: 0.6, response_mime_type: 'application/json' }
  };

  async function attempt(model){
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
    const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    let data;
    try{ data = await res.json(); }catch(e){ data = null; }
    if(!res.ok){
      const err = new Error(data?.error?.message || ('HTTP '+res.status));
      err.status = res.status;
      throw err;
    }
    const outText = data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('') || '';
    if(!outText){ const e = new Error('EMPTY_RESPONSE'); throw e; }
    const cleaned = outText.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
    try{ return JSON.parse(cleaned); }
    catch(e){ const err = new Error('AI থেকে প্রাপ্ত ফলাফল JSON আকারে পার্স করা যায়নি'); throw err; }
  }

  const primaryModel = await getActiveModel(apiKey, false);
  const candidates = [primaryModel, ...FALLBACK_MODEL_CHAIN];
  const tried = new Set();
  let lastErr = null;

  for(const m of candidates){
    if(tried.has(m)) continue;
    tried.add(m);
    // Give each model up to 2 tries (helps with a one-off overload/504 blip)
    // before silently moving to the next model in the chain.
    for(let localTry=0; localTry<2; localTry++){
      try{
        const result = await attempt(m);
        if(m !== primaryModel){ await sSet('modelCache', {model:m, at:Date.now()}); } // self-heal cache
        return result;
      }catch(e){
        lastErr = e;
        if(!isRecoverableModelError(e)) throw e; // real error (bad key, blocked content) — stop immediately
        if(localTry===0){ await sleep(350); continue; } // quick retry on the same model first
      }
    }
    // both tries on this model failed — move on to the next candidate silently
  }
  throw lastErr || new Error('কোনো সক্রিয় Gemini মডেল পাওয়া যায়নি');
}

    const best = await discoverBestModel(apiKey);
    await sSet('modelCache', {model:best, at:Date.now()});
    toast('✅ সক্রিয় মডেল: '+best);
    closeModal(); openSettingsModal();
  }catch(e){ toast('সনাক্ত করা যায়নি: '+e.message); }
}

/* ---- Split a large paste into reasonably-sized chunks along natural breaks (blank lines,
        numbered-question boundaries) so multiple smaller Gemini calls can run IN PARALLEL
        instead of one huge slow call. Keeps chunks under ~CHUNK_CHARS so each response stays
        fast, and caps the number of chunks so we don't fire an unbounded number of requests. ---- */
const CHUNK_CHARS = 2600;
const MAX_CHUNKS = 8;
function splitIntoChunks(text){
  const trimmed = (text||'').trim();
  if(trimmed.length <= CHUNK_CHARS) return [trimmed];
  // Prefer splitting on blank lines or numbered-question starts (e.g. "12.", "12)", "প্রশ্ন ১২")
  const boundary = /\n(?=\s*\n|\s*(?:\d{1,3}[.)]\s|প্রশ্ন\s*[০-৯0-9]))/g;
  const pieces = trimmed.split(boundary).map(p=>p.trim()).filter(Boolean);
  const chunks = [];
  let buf = '';
  for(const p of pieces){
    if(buf && (buf.length + p.length + 1) > CHUNK_CHARS){ chunks.push(buf); buf = p; }
    else{ buf = buf ? buf+'\n'+p : p; }
  }
  if(buf) chunks.push(buf);
  // Fallback: if boundary-splitting didn't help (e.g. one giant paragraph), hard-slice it.
  if(chunks.length===1 && chunks[0].length>CHUNK_CHARS*1.3){
    const hard = [];
    for(let i=0;i<chunks[0].length;i+=CHUNK_CHARS) hard.push(chunks[0].slice(i,i+CHUNK_CHARS));
    return hard.slice(0,MAX_CHUNKS);
  }
  return chunks.slice(0,MAX_CHUNKS);
}

/* Run a batch of async jobs with a concurrency cap, calling onProgress(done,total) as each finishes. */
async function runWithConcurrency(items, limit, worker, onProgress){
  const results = new Array(items.length);
  let next = 0, done = 0;
  async function runner(){
    while(next < items.length){
      const i = next++;
      try{ results[i] = await worker(items[i], i); }
      catch(e){ results[i] = { __error: e }; }
      done++;
      if(onProgress) onProgress(done, items.length);
    }
  }
  const runners = Array.from({length: Math.min(limit, items.length)}, runner);
  await Promise.all(runners);
  return results;
}

/* ---- Unified extraction prompt: handles ONE question, HUNDREDS of pasted lines, or raw notes.
        Always returns { "items": [...] }. When routeChapters is given, each item also carries
        a "chapterName" so a whole subject dump can be auto-sorted chapter-wise.

        CORE-QUESTION-MASTERY CONTRACT (read this before touching the prompt):
        This app's entire purpose is mastery of the questions the STUDENT personally selected —
        not AI-driven content expansion. Ingestion's only job is to turn whatever the student
        pasted into a small set of CORE QUESTIONS (one core question per question the student
        actually selected/pasted). It must never invent extra practice questions, never expand
        a single pasted question into several, and never treat a raw paragraph as licence to
        produce more than a couple of MCQs directly tied to what's explicitly stated in it.
        Controlled *variation* (changing numbers/wording/option order while preserving the exact
        concept and solving method) happens later, at EXAM TIME — for numeric items that's
        deterministic variable substitution, for concept items that's the explicit, user-triggered
        "generate more variations" action. Ingestion itself must stay 1-question-in, 1-core-question-out. ---- */
function buildExtractionPrompt({rawText, hasImage, routeChapters}){
  const routingInstruction = (routeChapters && routeChapters.length)
    ? `\nএই গ্রুপে ইতিমধ্যে বিদ্যমান অধ্যায়সমূহ: ${routeChapters.map(c=>'"'+c+'"').join(', ')}।\nপ্রতিটি আইটেমের জন্য "chapterName" ফিল্ড অবশ্যই দাও — বিষয়বস্তু উপরের কোনো অধ্যায়ের সাথে মিললে হুবহু সেই নামটাই লিখো (বানান/স্পেসিং একদম অভিন্ন রাখো), কোনোটার সাথে না মিললে বিষয়বস্তু বুঝে যুক্তিসঙ্গত নতুন অধ্যায়ের নাম দাও।`
    : (routeChapters ? `\nপ্রতিটি আইটেমে একটি ছোট "chapterName" ফিল্ড দাও যা প্রশ্নের উপ-বিষয়/টপিক বোঝায়।` : '');
  return `তুমি একজন বাংলাদেশের ভর্তি পরীক্ষা (মেডিকেল/ভার্সিটি ভর্তি, HSC/SSC) প্রশ্ন বিশ্লেষক AI। তোমার কাজ হলো শিক্ষার্থীর নিজের বেছে নেওয়া প্রশ্নগুলোকে পরিষ্কার "CORE QUESTION" আকারে সংরক্ষণের জন্য প্রস্তুত করা — নতুন প্রশ্ন তৈরি করে কনটেন্ট বাড়ানো তোমার কাজ না।

কঠোর নিয়ম (অবশ্যই মানতে হবে):
১) শিক্ষার্থী যতগুলো প্রশ্ন পেস্ট/সংযুক্ত করেছে, ঠিক ততগুলো আইটেমই তৈরি করবে — এক থেকে একাধিক বানিয়ে সংখ্যা বাড়াবে না। প্রতিটি শনাক্তযোগ্য প্রশ্নের জন্য একটিমাত্র "core" আইটেম দাও।
২) যদি টেক্সট অপশনসহ সম্পূর্ণ MCQ হয়, সেই প্রশ্ন-অপশন-উত্তর হুবহু (ভাষাগতভাবে পরিষ্কার করে, কিন্তু অর্থ/ধারণা অবিকৃত রেখে) ব্যবহার করবে — নতুন করে ভিন্ন প্রশ্ন বানাবে না।
৩) যদি টেক্সট কাঁচা নোট/অনুচ্ছেদ/বইয়ের অংশ হয় (অপশন/উত্তর ছাড়া), তাহলে শুধুমাত্র ঐ অংশে স্পষ্টভাবে উল্লিখিত মূল তথ্য/সংজ্ঞা/সূত্র থেকে সর্বোচ্চ ২-৩টি MCQ বানাও — পুরো অনুচ্ছেদকে ডজন ডজন প্রশ্নে রূপান্তর করবে না, এবং অনুচ্ছেদে নেই এমন কোনো নতুন তথ্য/তথ্যভিত্তিক প্রশ্ন যোগ করবে না।
৪) প্রতিটি আইটেম হবে শুধু একটি CORE প্রশ্ন — একাধিক প্রি-জেনারেটেড ভ্যারিয়েশন এখানে বানাবে না। ভ্যারিয়েশন পরে পরীক্ষার সময় আলাদাভাবে তৈরি হবে।${hasImage?' একটি ছবিও সংযুক্ত থাকতে পারে — ছবিতে থাকা প্রশ্ন(সমূহ)ও একইভাবে (এক প্রশ্নে এক core আইটেম) বিশ্লেষণ করো।':''}

প্রতিটি core প্রশ্নের জন্য নিচের দুই ধাপ অনুসরণ করো:

ধাপ ১ — প্রকারভেদ:
(ক) "numeric" — সাংখ্যিক/গাণিতিক সমস্যা যেখানে সংখ্যা বদলালেই কাঠামো ঠিক রেখে নতুন প্রশ্ন হয় (গণিত, পদার্থবিজ্ঞান, রসায়নের সাংখ্যিক সমস্যা)।
(খ) "concept" — ধারণাভিত্তিক/তাত্ত্বিক/সাহিত্য/জীববিজ্ঞান/ইতিহাস/গ্রামার ইত্যাদি, যেখানে সংখ্যা বদলে নতুন প্রশ্ন বানানো সম্ভব না — প্রসঙ্গ/উদাহরণ/শব্দচয়ন বদলাতে হয়।

ধাপ ২ — স্কিমা অনুযায়ী একটিমাত্র core আইটেম তৈরি করো (একাধিক ভ্যারিয়েশন না):

"numeric" হলে — মূল প্রশ্নের সংখ্যাগুলোকে {a},{b},{c}.. ভেরিয়েবলে রূপান্তর করো যাতে পরীক্ষার সময় একই সমস্যাকাঠামোর মধ্যে নতুন সংখ্যা বসিয়ে অনুশীলন করা যায়:
{
  "type": "numeric",${routingInstruction ? '\n  "chapterName": "...",' : ''}
  "stem": "মূল প্রশ্নের বিবৃতি — গাণিতিক রাশির জন্য $...$ ব্যবহার করো, পরিবর্তনযোগ্য সংখ্যার জায়গায় {a},{b},{c}... বসাও",
  "stemVariants": ["একই {a},{b}.. ভেরিয়েবল ব্যবহার করে, একই প্রশ্নের অর্থ অবিকৃত রেখে সামান্য ভিন্ন ভাষা/শব্দবিন্যাসে লেখা ১-২টি বিকল্প বিবৃতি — যাতে পরীক্ষায় প্রতিবার প্রশ্নটা হুবহু এক রকম না লাগে"],
  "variables": [{"name":"a","min":সর্বনিম্ন,"max":সর্বোচ্চ}, ...],
  "optionExprs": ["সঠিক উত্তরের math.js এক্সপ্রেশন যেমন {a}+{b}*2", "ভুল অপশন ১ এর সূত্র", "ভুল অপশন ২", "ভুল অপশন ৩"],
  "correctIndex": 0,
  "explanation": "সমাধানের সংক্ষিপ্ত ব্যাখ্যা"
}
নিয়ম: variable-এর রেঞ্জ এমন যাতে কোনো র‍্যান্ডম মানেই শূন্য দিয়ে ভাগ, ঋণাত্মক বর্গমূল, বা অবাস্তব ফলাফল না হয়। optionExprs অবশ্যই বৈধ গাণিতিক সূত্র হতে হবে (নিছক স্থির সংখ্যা নয়), যাতে ভেরিয়েবল বদলালে সব অপশনও বদলায়। ৩টি ভুল অপশন যৌক্তিক সাধারণ ভুলের প্যাটার্ন অনুসরণ করবে এবং সঠিক অপশনের সমান কখনো হবে না। এই optionExprs গুলো অবশ্যই মূল প্রশ্নের একই সমাধান-পদ্ধতি/সূত্র প্রতিফলিত করবে — ভিন্ন কোনো উপায়ে সমাধান করা যায় এমন নতুন সমস্যা বানাবে না।

"concept" হলে — শুধু একটি "variations" অ্যারে দাও যাতে একটিমাত্র (মূল) আইটেম থাকবে (আরও ভ্যারিয়েশন প্রয়োজন হলে শিক্ষার্থী পরে সরাসরি চাইলে তৈরি হবে):
{
  "type": "concept",${routingInstruction ? '\n  "chapterName": "...",' : ''}
  "variations": [
    {"stem":"মূল প্রশ্ন, ভাষাগতভাবে পরিষ্কার করা কিন্তু ধারণা/অর্থ অবিকৃত","options":["ক","খ","গ","ঘ"],"correctIndex":0,"explanation":"..."}
  ]
}

সবশেষে ঠিক এই আকারে আউটপুট দাও (অন্য কিছু লিখবে না, মার্কডাউন কোড ব্লকও না):
{ "items": [ ...উপরের নিয়ম মেনে, শিক্ষার্থীর পাঠানো টেক্সটে যতগুলো প্রশ্ন সরাসরি আছে (বা নোটের ক্ষেত্রে সর্বোচ্চ ২-৩টি) ঠিক ততগুলো আইটেম... ] }

মূল প্রশ্নের ভাষা (বাংলা/ইংরেজি) বজায় রাখো। শুধুমাত্র বৈধ JSON আউটপুট দাও, অন্য কোনো টেক্সট নয়।

ব্যবহারকারীর টেক্সট:
${rawText || '(সংযুক্ত ছবিতে দেওয়া প্রশ্ন(সমূহ) বিশ্লেষণ করো)'}`;
}

}
function addVarRow(){
  document.getElementById('var-rows').insertAdjacentHTML('beforeend', varRow({name:'',min:1,max:9}));
}
function optRow(val, i, checked){
  return `<div class="opt-row">
    <input type="radio" name="correct-opt" value="${i}" ${checked?'checked':''}>
    <input type="text" class="opt-expr" value="${esc(val)}" placeholder="সূত্র, যেমন {a}+{b}">
  </div>`;

async function saveTemplateForm(chapterId, templateId){
  const stem = document.getElementById('tpl-stem').value.trim();
  if(!stem) return toast('প্রশ্ন লিখুন');
  const variantsEl = document.getElementById('tpl-stem-variants');
  const stemVariants = variantsEl ? variantsEl.value.split('\n').map(s=>s.trim()).filter(Boolean) : [];
  const names = [...document.querySelectorAll('.var-name')].map(x=>x.value.trim());
  const mins = [...document.querySelectorAll('.var-min')].map(x=>parseFloat(x.value));
  const maxs = [...document.querySelectorAll('.var-max')].map(x=>parseFloat(x.value));
  const variables = names.map((n,i)=>({name:n, min:mins[i], max:maxs[i]})).filter(v=>v.name);
  const exprs = [...document.querySelectorAll('.opt-expr')].map(x=>x.value.trim());
  const correctRadio = document.querySelector('input[name=correct-opt]:checked');
  const correctIndex = correctRadio ? parseInt(correctRadio.value) : 0;
  const explanation = document.getElementById('tpl-expl').value.trim();
  if(exprs.some(e=>!e)) return toast('সব অপশন পূরণ করুন');
  const data = {chapterId, type:'numeric', stem, stemVariants, variables, optionExprs:exprs, correctIndex, explanation};
  if(templateId){ Object.assign(DB.templates.find(x=>x.id===templateId), data); }
  else { DB.templates.push({id:uid(), ...data}); }
  await saveTemplates(); closeModal(); toast('সংরক্ষিত হয়েছে'); render();
}

    <div id="concept-var-list">
      ${t.variations.map((v,i)=>conceptVarBlock(v,i)).join('')}
    </div>
    <div class="btn-row" style="margin-top:14px;">
      <button class="btn btn-gold" onclick="generateMoreVariations('${chapterId}','${t.id}')" id="gen-more-btn">⚡ এই একই মূল প্রশ্নের আরও কিছু কন্ট্রোল্ড ভ্যারিয়েশন তৈরি করো</button>
    </div>
    <div class="btn-row" style="margin-top:14px;">
      <button class="btn btn-primary" onclick="saveConceptEdits('${chapterId}','${t.id}')">সংরক্ষণ করুন</button>
      <button class="btn" onclick="closeModal()">বাতিল</button>

function conceptVarBlock(v,i){
  return `<div class="review-item" data-idx="${i}" style="margin-bottom:10px;">
    <div class="field"><label>প্রশ্ন ${i+1}</label><textarea class="cv-stem">${esc(v.stem)}</textarea></div>
    <div class="field"><label>অপশন — সঠিকটিতে বাটন চাপুন</label>
      ${v.options.map((o,oi)=>`<div class="opt-row"><input type="radio" name="cv-correct-${i}" value="${oi}" ${oi===v.correctIndex?'checked':''}><input type="text" class="cv-opt" value="${esc(o)}"></div>`).join('')}
    </div>
    <div class="field"><label>ব্যাখ্যা</label><textarea class="cv-expl">${esc(v.explanation||'')}</textarea></div>
    <button class="btn btn-danger" type="button" onclick="this.closest('.review-item').remove()">এই ভ্যারিয়েশনটি মুছুন</button>
  </div>`;
}
async function saveConceptEdits(chapterId, templateId){
  const t = DB.templates.find(x=>x.id===templateId);
  const blocks = [...document.querySelectorAll('#concept-var-list .review-item')];
  const variations = blocks.map(b=>{
    const stem = b.querySelector('.cv-stem').value.trim();
    const opts = [...b.querySelectorAll('.cv-opt')].map(x=>x.value.trim());
    const checked = b.querySelector('input[type=radio]:checked');
    const correctIndex = checked ? parseInt(checked.value) : 0;
    const explanation = b.querySelector('.cv-expl').value.trim();
    return {stem, options:opts, correctIndex, explanation};
  }).filter(v=>v.stem && v.options.every(o=>o));
  if(variations.length===0) return toast('অন্তত একটি ভ্যারিয়েশন থাকতে হবে');
  t.variations = variations;
  t.stem = variations[0].stem;
  await saveTemplates();
  closeModal();
  toast('সংরক্ষিত হয়েছে');
  document.getElementById('view').innerHTML = viewTemplateList(chapterId);
}
async function generateMoreVariations(chapterId, templateId){
  const t = DB.templates.find(x=>x.id===templateId);
  const apiKey = await sGet('geminiApiKey');
  if(!apiKey){ closeModal(); toast('প্রথমে Gemini API Key সেট করুন'); openSettingsModal(); return; }
  const btn = document.getElementById('gen-more-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'তৈরি হচ্ছে...'; }
  try{
    const base = t.variations[0];
    const followUp = `মূল (CORE) প্রশ্ন: ${base.stem}\nঅপশনসমূহ: ${base.options.join(' | ')}\nসঠিক উত্তর: ${base.options[base.correctIndex]}\nব্যাখ্যা: ${base.explanation||''}\n\nএই ঠিক এই মূল প্রশ্নটির উপর ভিত্তি করে ৩-৪টি কন্ট্রোল্ড ভ্যারিয়েশন তৈরি করো — শুধু প্রসঙ্গ/উদাহরণ/শব্দচয়ন/অপশনের ক্রম বদলাবে। কঠোরভাবে মেনে চলো: প্রতিটি ভ্যারিয়েশন অবশ্যই একই অন্তর্নিহিত ধারণা/তথ্য, একই সমাধান-পদ্ধতি এবং একই উত্তরের যুক্তি পরীক্ষা করবে যা মূল প্রশ্নটি করে — অধ্যায়ের অন্য কোনো তথ্য/উপ-টপিক নিয়ে নতুন প্রশ্ন বানাবে না। কোনো ভ্যারিয়েশনই মূল প্রশ্ন থেকে ধারণাগতভাবে সরে যাবে না।`;
    const data = await callGeminiAPI({ text: buildExtractionPrompt({rawText: followUp, hasImage:false, routeChapters:null}) });
    const items = Array.isArray(data.items) ? data.items : (data.type ? [data] : []);
    const conceptItem = items.find(i=>i.type==='concept' && Array.isArray(i.variations) && i.variations.length);
    if(conceptItem){
      t.variations.push(...conceptItem.variations);
      await saveTemplates();
      toast(`✅ ${conceptItem.variations.length} টি নতুন কন্ট্রোল্ড ভ্যারিয়েশন যোগ হয়েছে`);
      openConceptEditor(chapterId, t);
    } else {
      toast('AI থেকে সঠিক ফলাফল পাওয়া যায়নি, আবার চেষ্টা করো');
    }
  }catch(e){
    toast(e.message==='NO_API_KEY' ? 'প্রথমে API Key সেট করো' : 'ত্রুটি: '+e.message);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '⚡ এই একই মূল প্রশ্নের আরও কিছু কন্ট্রোল্ড ভ্যারিয়েশন তৈরি করো'; }
  }
}

/* ============================= UNIFIED AI INGESTION ENGINE =============================
   One entry point handles BOTH:
     mode:'chapter' — quick-add into a single already-open chapter (single Q or a paste of a
                       few questions the student selected)
     mode:'bulk'    — paste several selected questions for a GROUP at once; AI turns each into
                       a CORE QUESTION and assigns/creates the correct chapter for each one
                       automatically. This is still 1-selected-question-in, 1-core-question-out —
                       "bulk" refers to handling many *pasted* questions in one go, not to
                       expanding content beyond what the student selected.
========================================================================================= */
let currentIngest = null;
let quickAddCount = 0;
let quickAddChapCount = 0;
let attachedImage = null; // {base64, mime}

  openModal(`

async function closeIngestAndRefresh(){
  const ingest = currentIngest;
  closeModal();
  if(!ingest) return;
  if(ingest.mode==='bulk'){
    document.getElementById('view').innerHTML = await viewData();
  } else if(ingest.mode==='chapter'){
    document.getElementById('view').innerHTML = viewTemplateList(ingest.chapterId);
  }
}

function resolveOrCreateChapter(groupId, chapterName){
  const name = (chapterName||'').trim();
  const chaptersInGroup = DB.chapters.filter(c=>c.groupId===groupId);
  if(name){
    const found = chaptersInGroup.find(c=>c.name.trim().toLowerCase()===name.toLowerCase());
    if(found) return found.id;
    const newChap = {id:uid(), groupId, name, order:chaptersInGroup.length};
    DB.chapters.push(newChap);
    return newChap.id;
  }
  let general = chaptersInGroup.find(c=>c.name==='সাধারণ (AI ইমপোর্ট)');
  if(!general){
    general = {id:uid(), groupId, name:'সাধারণ (AI ইমপোর্ট)', order:chaptersInGroup.length};
    DB.chapters.push(general);
  }
  return general.id;
}

function insertTemplateFromItem(chapterId, item){
  if(!item || !item.type) return false;
  if(item.type==='numeric'){
    if(!item.stem || !Array.isArray(item.optionExprs) || item.optionExprs.length<2) return false;
    DB.templates.push({
      id: uid(), chapterId, type:'numeric',
      stem: item.stem,
      stemVariants: Array.isArray(item.stemVariants) ? item.stemVariants.filter(s=>s && s.trim()) : [],
      variables: Array.isArray(item.variables) ? item.variables : [],
      optionExprs: item.optionExprs,
      correctIndex: Number.isInteger(item.correctIndex) ? item.correctIndex : 0,
      explanation: item.explanation || ''
    });
    return true;
  }
  if(item.type==='concept'){
    if(!Array.isArray(item.variations) || item.variations.length===0) return false;
    // Ingestion contract: keep only the single core variation here even if the
    // model over-produced — extra variations only ever get added later via the
    // explicit, user-triggered "generate more variations" action.
    const variations = item.variations.filter(v=>v && v.stem && Array.isArray(v.options) && v.options.length>=2).slice(0,1);
    if(variations.length===0) return false;
    DB.templates.push({
      id: uid(), chapterId, type:'concept',
      stem: variations[0].stem,
      variations
    });
    return true;
  }
  return false;
}

const INGEST_CONCURRENCY = 3; // parallel Gemini calls for a paste of several selected questions

async function runIngest(){
  const rawTextEl = document.getElementById('ai-raw-text');
  const rawText = rawTextEl ? rawTextEl.value.trim() : '';
  if(!rawText && !attachedImage){ toast('টেক্সট লেখো, বলো, অথবা ছবি দাও'); return; }
  const apiKey = await sGet('geminiApiKey');
  if(!apiKey){ toast('প্রথমে Gemini API Key সেট করো'); openSettingsModal(); return; }

  const btn = document.getElementById('ai-parse-btn');
  const progressEl = document.getElementById('ingest-progress');
  btn.disabled = true; const prevLabel = btn.textContent; btn.textContent = '⏳';
  try{
    const isBulk = currentIngest && currentIngest.mode==='bulk';
    let routeChapters = null;
    if(isBulk){
      routeChapters = DB.chapters.filter(c=>c.groupId===currentIngest.groupId).map(c=>c.name);
    }

    // An image always goes through as a single request. A long paste of many selected
    // questions gets split into chunks and processed IN PARALLEL — this is what keeps
    // a big paste fast. Chunking is purely about throughput; it never changes the
    // 1-question-in, 1-core-question-out rule enforced inside the extraction prompt.
    const chunks = attachedImage ? [rawText] : splitIntoChunks(rawText);
    let allItems = [];

    if(chunks.length <= 1){
      const prompt = buildExtractionPrompt({rawText: chunks[0] ?? rawText, hasImage: !!attachedImage, routeChapters});
      const data = await callGeminiAPI({
        text: prompt,
        imageBase64: attachedImage ? attachedImage.base64 : undefined,
        imageMime: attachedImage ? attachedImage.mime : undefined
      });
      allItems = Array.isArray(data.items) ? data.items : (data.type ? [data] : []);
    } else {
      progressEl.style.display = 'block';
      progressEl.textContent = `প্রসেস হচ্ছে... (০/${chunks.length} অংশ সম্পন্ন)`;
      const results = await runWithConcurrency(chunks, INGEST_CONCURRENCY, async (chunkText)=>{
        const prompt = buildExtractionPrompt({rawText: chunkText, hasImage:false, routeChapters});
        return await callGeminiAPI({ text: prompt });
      }, (done,total)=>{
        progressEl.textContent = `প্রসেস হচ্ছে... (${done}/${total} অংশ সম্পন্ন)`;
      });
      for(const r of results){
        if(!r || r.__error) continue; // one failed chunk shouldn't sink the whole paste
        const its = Array.isArray(r.items) ? r.items : (r.type ? [r] : []);
        allItems.push(...its);
      }
      progressEl.style.display = 'none';
    }

    if(allItems.length===0){ toast('AI কোনো প্রশ্ন শনাক্ত করতে পারেনি, আরেকটু স্পষ্ট করে দাও'); return; }

    const chaptersTouched = new Set();
    let added = 0;
    for(const item of allItems){
      const chapterId = isBulk ? resolveOrCreateChapter(currentIngest.groupId, item.chapterName) : currentIngest.chapterId;
      const ok = insertTemplateFromItem(chapterId, item);
      if(ok){ added++; chaptersTouched.add(chapterId); }
    }
    if(added===0){ toast('AI বুঝতে পারেনি, আরেকটু স্পষ্ট করে দাও'); return; }

    if(isBulk){ await saveChapters(); }
    await saveTemplates();
    quickAddCount += added; quickAddChapCount += chaptersTouched.size;
    const c1 = document.getElementById('quick-add-count'); if(c1) c1.textContent = quickAddCount;
    const c2 = document.getElementById('quick-add-chaps'); if(c2) c2.textContent = quickAddChapCount;
    rawTextEl.value=''; autoGrowInput(rawTextEl); clearAttachment();
    toast(`✅ ${added} টি CORE প্রশ্ন যোগ হয়েছে` + (isBulk ? ` (${chaptersTouched.size} টি অধ্যায়ে)` : ''));
    rawTextEl.focus();
  }catch(e){
    if(e.message==='NO_API_KEY'){ toast('প্রথমে API Key সেট করো'); openSettingsModal(); }
    else toast('সমস্যা হয়েছে: ' + e.message);
  }finally{
    btn.disabled = false; btn.textContent = prevLabel;
    if(progressEl) progressEl.style.display = 'none';
  }
}

/* ---- Unified input helpers: voice, image attach, auto-grow ---- */
function autoGrowInput(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 220) + 'px';
}
function previewAttachment(input){
  const file = input.files[0];
  if(!file) return;
  fileToBase64(file).then(b64=>{
    attachedImage = { base64: b64, mime: file.type };
    document.getElementById('attach-thumb').src = 'data:'+file.type+';base64,'+b64;
    document.getElementById('attach-preview').style.display = 'flex';
  });
}
function clearAttachment(){
  attachedImage = null;
  const input = document.getElementById('ai-image-input');
  if(input) input.value = '';
  const preview = document.getElementById('attach-preview');
  if(preview) preview.style.display = 'none';
}
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
let recognition;
function toggleVoiceInput(){
  const btn = document.getElementById('mic-btn');
  const ta = document.getElementById('ai-raw-text');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('এই ব্রাউজারে ভয়েস ইনপুট নেই — Chrome ব্যবহার করো'); return; }
  if(recognition && recognition._active){ recognition.stop(); return; }
  recognition = new SR();
  recognition.lang = 'bn-BD';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  recognition._active = true;
  btn.classList.add('recording'); btn.textContent = '🔴';
  recognition.onresult = (e)=>{
    const t = e.results[0][0].transcript;
    ta.value = (ta.value ? ta.value + ' ' : '') + t;
    autoGrowInput(ta);
  };
  recognition.onerror = ()=>{ toast('ভয়েস বোঝা যায়নি, আবার চেষ্টা করো'); };
  recognition.onend = ()=>{ recognition._active = false; btn.classList.remove('recording'); btn.textContent = '🎤'; };
  recognition.start();
}

/* ============================= VARIATION ENGINE ============================= */
function subst(text, values){
  return text.replace(/\{(\w+)\}/g, (m,k)=> values[k]!==undefined ? values[k] : m);
}
function safeEval(expr){
  try{
    const v = math.evaluate(expr);
    if(typeof v !== 'number' || !isFinite(v) || Number.isNaN(v)) return null;
    return Math.round(v*1000)/1000;
  }catch(e){ return null; }
}
function shuffleOptionsArr(options, correctIndex){
  const idxArr = options.map((_,i)=>i);
  for(let i=idxArr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idxArr[i],idxArr[j]]=[idxArr[j],idxArr[i]]; }
  const shuffled = idxArr.map(i=>options[i]);
  const newCorrectIndex = idxArr.indexOf(correctIndex);
  return { options: shuffled, correctIndex: newCorrectIndex };
}
function generateVariation(template, usedSignatures){
  return template.type === 'concept'
    ? generateConceptVariation(template, usedSignatures)
    : generateNumericVariation(template, usedSignatures);
}
function generateNumericVariation(template, usedSignatures){
  const MAX_TRY = 40;
  const stemPool = [template.stem, ...(template.stemVariants||[])].filter(Boolean);
  for(let attempt=0; attempt<MAX_TRY; attempt++){
    const scope = {};
    (template.variables||[]).forEach(v=>{
      const lo = Math.ceil(v.min), hi = Math.floor(v.max);
      scope[v.name] = lo + Math.floor(Math.random()*Math.max(1,(hi-lo+1)));
    });
    const stemIdx = Math.floor(Math.random()*stemPool.length);
    const stemChoice = stemPool[stemIdx];
    const sig = template.id+':n:'+stemIdx+':'+JSON.stringify(scope);
    if(usedSignatures.has(sig)) continue;
    const values = template.optionExprs.map(e => safeEval(subst(e, scope)));
    if(values.some(v=>v===null)) continue;
    const uniqueVals = new Set(values.map(v=>v.toString()));
    if(uniqueVals.size !== values.length) continue;
    usedSignatures.add(sig);
    const stemText = subst(stemChoice, scope);
    const {options, correctIndex} = shuffleOptionsArr(values.map(v=>String(v)), template.correctIndex);
    return {
      templateId: template.id, chapterId: template.chapterId,
      stem: stemText, options, correctIndex, explanation: template.explanation||''
    };
  }
  return null;
}
function generateConceptVariation(template, usedSignatures){
  const variations = (template.variations && template.variations.length)
    ? template.variations
    : [{ stem: template.stem, options: template.optionExprs||[], correctIndex: template.correctIndex||0, explanation: template.explanation||'' }];
  let candidates = variations.map((v,i)=>i).filter(i=>!usedSignatures.has(template.id+':c:'+i));
  if(candidates.length===0) candidates = variations.map((v,i)=>i);
  const pick = candidates[Math.floor(Math.random()*candidates.length)];
  usedSignatures.add(template.id+':c:'+pick);
  const v = variations[pick];
  const {options, correctIndex} = shuffleOptionsArr(v.options, v.correctIndex);
  return {
    templateId: template.id, chapterId: template.chapterId,
    stem: v.stem, options, correctIndex, explanation: v.explanation||''
  };
}

let setupSelection = { preset: PRESETS[0], custom:false };

          const cnt = DB.templates.filter(t=>t.chapterId===c.id).length;
          return `<div class="chapter-row">
            <div style="display:flex; align-items:center; gap:12px;">

              <div><div class="chapter-name">${esc(c.name)}</div><div class="chapter-count">${cnt} টি প্রশ্ন</div></div>

  `;
}
function pickPreset(i){
  setupSelection.preset = PRESETS[i]; setupSelection.custom=false;
  document.querySelectorAll('.preset').forEach(p=>p.classList.remove('active'));
  document.querySelector(`.preset[data-i="${i}"]`).classList.add('active');
  document.getElementById('custom-fields').style.display='none';
}
function pickCustom(){
  setupSelection.custom = true;
  document.querySelectorAll('.preset').forEach(p=>p.classList.remove('active'));
  document.getElementById('preset-custom').classList.add('active');
  document.getElementById('custom-fields').style.display='block';
}
function toggleGroupSelect(groupId, checked){
  DB.chapters.filter(c=>c.groupId===groupId).forEach(c=>{
    const el = document.querySelector(`.chap-check[data-chapter="${c.id}"]`);
    if(el) el.checked = checked;
  });
}

async function beginExam(weakChapterIds){
  let chapterIds;
  if(weakChapterIds){ chapterIds = weakChapterIds; }
  else { chapterIds = [...document.querySelectorAll('.chap-check:checked')].map(x=>x.dataset.chapter); }
  if(chapterIds.length===0) return toast('অন্তত একটি অধ্যায় নির্বাচন করুন');
  const pool = DB.templates.filter(t=>chapterIds.includes(t.chapterId));
  if(pool.length===0) return toast('নির্বাচিত অধ্যায়ে কোনো প্রশ্ন নেই');

  let n, durationSec;
  if(weakChapterIds){ n = Math.min(20, pool.length*3); durationSec = n*45; }
  else if(setupSelection.custom){
    n = parseInt(document.getElementById('custom-n').value)||10;
    durationSec = (parseInt(document.getElementById('custom-t').value)||10)*60;
  } else { n = setupSelection.preset.n; durationSec = setupSelection.preset.t*60; }

  const usedSig = new Set();
  const questions = [];
  let shuffledPool = [...pool];
  let guard = 0;
  while(questions.length < n && guard < n*10){
    guard++;
    if(shuffledPool.length===0) shuffledPool = [...pool];
    const idx = Math.floor(Math.random()*shuffledPool.length);
    const tpl = shuffledPool.splice(idx,1)[0];
    const q = generateVariation(tpl, usedSig);
    if(q) questions.push(q);
  }
  if(questions.length===0) return toast('বৈধ প্রশ্ন তৈরি করা যায়নি — প্রশ্ন প্যাটার্ন পরীক্ষা করুন');

  currentExam = {
    id: uid(),
    startedAt: Date.now(),
    durationSec,
    questions,
    answers: {},
    _focusIdx: 0,
    status: 'active'
  };
  await saveExam();
  nav('exam');
}

/* ============================= EXAM RUNNER ============================= */
let examTick = null;
async function viewExam(){
  if(!currentExam){ nav('examsetup'); return ''; }
  return renderExamBody();
}
function renderExamBody(){
  const total = currentExam.questions.length;
  const answered = Object.keys(currentExam.answers).length;
  const idx = currentExam._focusIdx || 0;
  const q = currentExam.questions[idx];
  const remaining = examRemainingSecs();
  return `
  <div class="watermark">${esc(DB.profile.name)}</div>
  <div class="exam-header-fixed" id="exam-header">
    <div class="exam-top">
      <button class="exam-exit-btn" onclick="exitExamPrompt()" title="Esc">✕ বের হও</button>
      <div class="exam-top-info">উত্তর দেওয়া হয়েছে: ${answered}/${total}</div>
      <div class="timer ${remaining<60?'low':''}" id="exam-timer">${fmtSecs(remaining)}</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${(answered/total*100)}%;"></div></div>
  </div>
  <div class="q-wrap" id="q-wrap">
    <div class="q-num">প্রশ্ন ${idx+1} / ${total}</div>
    <div class="q-stem">${renderMath(q.stem)}</div>
    ${q.options.map((opt,i)=>{
      const selected = currentExam.answers[idx]===i;
      const locked = currentExam.answers[idx]!==undefined;
      return `<div class="opt ${selected?'selected':''} ${locked?'locked':''}" onclick="${locked?'':'selectAnswer('+idx+','+i+')'}">
        <span class="opt-key">${i+1}</span>
        <div class="radio-dot"><div class="fill"></div></div>
        <div class="opt-text">${renderMath(opt)}</div>
      </div>`;
    }).join('')}
  </div>
  <div class="exam-nav">
    <button class="btn" onclick="examGo(${idx-1})" ${idx===0?'disabled':''}>← আগের</button>
    <div class="btn-row">
      ${idx<total-1 ? `<button class="btn btn-primary" onclick="examGo(${idx+1})">পরবর্তী → <span class="kbd-hint">Enter</span></button>` : `<button class="btn btn-gold" onclick="confirmSubmitExam()">জমা দিন <span class="kbd-hint">Enter</span></button>`}
      ${idx<total-1 ? `<button class="btn btn-gold" onclick="confirmSubmitExam()">জমা দিন</button>` : ''}
    </div>
  </div>`;
}
function examRemainingSecs(){
  const elapsed = (Date.now() - currentExam.startedAt)/1000;
  return Math.max(0, currentExam.durationSec - elapsed);
}
async function selectAnswer(qIdx, optIdx){
  if(currentExam.answers[qIdx]!==undefined) return;
  currentExam.answers[qIdx] = optIdx;
  await saveExam();
  document.getElementById('view').innerHTML = renderExamBody();
}
function examGo(idx){
  if(!currentExam || idx<0 || idx>=currentExam.questions.length) return;
  currentExam._focusIdx = idx;
  document.getElementById('view').innerHTML = renderExamBody();
  window.scrollTo(0,0);
}
async function exitExamPrompt(){
  const ok = await showConfirm('তোমার অগ্রগতি সংরক্ষিত থাকবে, পরে ফিরে এসে চালিয়ে যেতে পারবে।', {title:'পরীক্ষা থেকে বের হবে?', confirmLabel:'হ্যাঁ, বের হও', cancelLabel:'না, চালিয়ে যাও'});
  if(ok) nav('dashboard');
}
function startExamTimerLoop(){
  clearInterval(examTick);
  examTick = setInterval(()=>{
    if(!currentExam || location.hash !== '#/exam'){ clearInterval(examTick); return; }
    const remaining = examRemainingSecs();
    const t = document.getElementById('exam-timer');
    if(t){ t.textContent = fmtSecs(remaining); t.classList.toggle('low', remaining<60); }
    if(remaining<=0){ clearInterval(examTick); submitExam(true); }
  }, 1000);
}
async function confirmSubmitExam(){
  const total = currentExam.questions.length;
  const answered = Object.keys(currentExam.answers).length;
  const unans = total-answered;
  const msg = `তুমি ${answered}/${total} টি প্রশ্নের উত্তর দিয়েছ${unans?` — ${unans}টি এখনো অনুত্তরিত`:''}। জমা দেওয়ার পর আর উত্তর বদলানো যাবে না।`;
  const ok = await showConfirm(msg, {title:'পরীক্ষা জমা দেবে?', confirmLabel:'হ্যাঁ, জমা দিন', cancelLabel:'আরেকটু দেখি', danger: unans>0});
  if(ok){
    clearInterval(examTick);
    submitExam(false);
  }
}
async function submitExam(auto){
  let correct=0, wrong=0, unanswered=0;
  const breakdown = currentExam.questions.map((q,i)=>{
    const ans = currentExam.answers[i];
    let status;
    if(ans===undefined){ unanswered++; status='skip'; }
    else if(ans===q.correctIndex){ correct++; status='correct'; }
    else { wrong++; status='wrong'; }
    return {stem:q.stem, options:q.options, correctIndex:q.correctIndex, userAnswer:ans, status, explanation:q.explanation, chapterId:q.chapterId, templateId:q.templateId};
  });
  const score = Math.round((correct - wrong*0.25)*100)/100;
  const total = currentExam.questions.length;
  const timeUsed = Math.round((Date.now()-currentExam.startedAt)/1000);
  const record = {
    id: currentExam.id, date: Date.now(), total, correct, wrong, unanswered, score,
    percentage: Math.round((score/total)*1000)/10,
    accuracy: (correct+wrong)>0 ? Math.round((correct/(correct+wrong))*1000)/10 : 0,
    timeUsedSec: timeUsed, breakdown, auto
  };
  DB.history.push(record);
  await saveHistory();
  await clearExam();
  nav('result/'+record.id);
}

/* ============================= RESULT / REVIEW ============================= */
function viewResult(id){
  const r = DB.history.find(x=>x.id===id);
  if(!r) return '<div class="empty-hint">ফলাফল পাওয়া যায়নি।</div>';
  return `
  <div class="score-hero">
    <div class="score-num">${r.score}</div>
    <div class="score-label">স্কোর (মোট ${r.total} এর মধ্যে) · ${r.percentage}%</div>
  </div>
  <div class="stat-grid">
    <div class="stat"><div class="v correct">${r.correct}</div><div class="l">সঠিক</div></div>
    <div class="stat"><div class="v wrong">${r.wrong}</div><div class="l">ভুল</div></div>
    <div class="stat"><div class="v">${r.unanswered}</div><div class="l">অনুত্তরিত</div></div>
    <div class="stat"><div class="v">${r.accuracy}%</div><div class="l">নির্ভুলতা</div></div>
  </div>
  <div class="stat" style="margin-bottom:20px;"><div class="v">${fmtSecs(r.timeUsedSec)}</div><div class="l">ব্যবহৃত সময়</div></div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="nav('review/${r.id}')">উত্তরপত্র পর্যালোচনা</button>
    <button class="btn" onclick="nav('dashboard')">ড্যাশবোর্ডে ফিরুন</button>
  </div>`;
}
function viewReview(id){
  const r = DB.history.find(x=>x.id===id);
  if(!r) return '<div class="empty-hint">পাওয়া যায়নি।</div>';
  return `
  <h2 class="section-title">উত্তরপত্র পর্যালোচনা</h2>
  <p class="section-sub">${r.correct} সঠিক · ${r.wrong} ভুল · ${r.unanswered} অনুত্তরিত</p>
  ${r.breakdown.map((b,i)=>`
    <div class="review-item">
      <span class="review-tag ${b.status==='correct'?'tag-correct':b.status==='wrong'?'tag-wrong':'tag-skip'}">
        ${b.status==='correct'?'✓ সঠিক':b.status==='wrong'?'✕ ভুল':'— অনুত্তরিত'}
      </span>
      <div class="q-num">প্রশ্ন ${i+1}</div>
      <div class="q-stem" style="font-size:.98rem;">${renderMath(b.stem)}</div>
      ${b.options.map((o,oi)=>{
        let cls='';
        if(oi===b.correctIndex) cls='is-correct';
        else if(oi===b.userAnswer) cls='is-wrong';
        return `<div class="review-opt ${cls}">${renderMath(o)} ${oi===b.correctIndex?' ✓':(oi===b.userAnswer?' ✕':'')}</div>`;
      }).join('')}
      ${b.explanation?`<div class="hint" style="margin-top:8px;">ব্যাখ্যা: ${renderMath(b.explanation)}</div>`:''}
    </div>`).join('')}
  <button class="btn" onclick="nav('performance')">পারফরম্যান্সে ফিরুন</button>`;
}

/* ============================= PERFORMANCE ============================= */
function viewPerformance(){
  if(DB.history.length===0){
    return `<h2 class="section-title">পারফরম্যান্স</h2><div class="empty-hint">এখনো কোনো পরীক্ষা সম্পন্ন হয়নি।</div>`;
  }
  const hist = [...DB.history].sort((a,b)=>a.date-b.date);
  const now = Date.now(), week = 7*24*3600*1000;
  const thisWeek = hist.filter(h=>now-h.date < week);
  const lastWeek = hist.filter(h=>now-h.date >= week && now-h.date < 2*week);
  const avg = arr => arr.length? Math.round(arr.reduce((s,h)=>s+h.percentage,0)/arr.length*10)/10 : null;
  const twAvg = avg(thisWeek), lwAvg = avg(lastWeek);
  const delta = (twAvg!==null && lwAvg!==null) ? Math.round((twAvg-lwAvg)*10)/10 : null;

  const chapStats = {};
  hist.forEach(h=>h.breakdown.forEach(b=>{
    chapStats[b.chapterId] = chapStats[b.chapterId] || {wrong:0, total:0};
    chapStats[b.chapterId].total++;
    if(b.status==='wrong') chapStats[b.chapterId].wrong++;
  }));
  const weakList = Object.entries(chapStats)
    .map(([cid,s])=>({cid, rate: s.wrong/s.total, ...s}))
    .filter(x=>x.total>=3 && x.rate>=0.35)
    .sort((a,b)=>b.rate-a.rate).slice(0,6);

  const maxPct = Math.max(...hist.map(h=>h.percentage), 100);
  const barsHtml = hist.slice(-12).map(h=>{
    const height = Math.max(4, (h.percentage/maxPct)*90);
    return `<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="font-size:.68rem; color:var(--ink-soft);">${h.percentage}%</div>
      <div style="width:60%; height:${height}px; background:var(--brass); border-radius:4px 4px 0 0;"></div>
    </div>`;
  }).join('');

  return `
  <h2 class="section-title">পারফরম্যান্স</h2>
  <div class="perf-summary">
    <div class="perf-card"><div class="v">${twAvg??'—'}${twAvg!==null?'%':''}</div><div class="l">এই সপ্তাহ</div></div>
    <div class="perf-card"><div class="v">${lwAvg??'—'}${lwAvg!==null?'%':''}</div><div class="l">গত সপ্তাহ</div></div>
    <div class="perf-card"><div class="v ${delta>0?'up':delta<0?'down':''}">${delta===null?'—':(delta>0?'+':'')+delta+'%'}</div><div class="l">পরিবর্তন</div></div>
  </div>
  <div class="chart-wrap">
    <div style="display:flex; align-items:flex-end; gap:8px; height:110px;">${barsHtml}</div>
  </div>
  ${weakList.length? `
  <h3 style="margin-bottom:10px; font-size:1rem;">দুর্বল অধ্যায়সমূহ</h3>
  ${weakList.map(w=>{
    const chap = DB.chapters.find(c=>c.id===w.cid);
    return `<div class="weak-row"><span>${esc(chap?chap.name:'—')}</span><span>${Math.round(w.rate*100)}% ভুল</span></div>`;
  }).join('')}
  <button class="btn btn-gold" style="margin:14px 0 26px;" onclick='practiceWeak(${JSON.stringify(weakList.map(w=>w.cid))})'>দুর্বল জায়গা প্র্যাকটিস করুন</button>
  ` : ''}
  <h3 style="margin-bottom:10px; font-size:1rem;">পরীক্ষার ইতিহাস</h3>
  ${[...hist].reverse().map(h=>`
    <div class="hist-item" onclick="nav('result/${h.id}')" style="cursor:pointer;">
      <div class="l">${fmtDate(h.date)} · ${h.total} প্রশ্ন</div>
      <div class="r">${h.percentage}%</div>
    </div>`).join('')}
  `;
}
window.practiceWeak = function(cids){ beginExam(cids); };

/* ============================= KEYBOARD SHORTCUTS ============================= */
document.addEventListener('keydown', (e)=>{
  const modalOpen = document.getElementById('modal-overlay').classList.contains('show');
  const active = document.activeElement;
  const inTextarea = active && active.tagName === 'TEXTAREA';
  const inInput = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT');

  // Esc: close modal, or go back to dashboard
  if(e.key === 'Escape'){
    if(modalOpen){ closeModal(); e.preventDefault(); return; }
    if(location.hash === '#/exam'){ return; } // avoid accidental exit from timed exam
    if(location.hash !== '#/dashboard' && location.hash !== '' && location.hash !== '#/'){
      nav('dashboard'); e.preventDefault();
    }
    return;
  }

  // Enter inside the ingestion textarea sends the AI request (Shift+Enter = newline)
  if(e.key === 'Enter' && active && active.id === 'ai-raw-text' && !e.shiftKey){
    e.preventDefault();
    const btn = document.getElementById('ai-parse-btn');
    if(btn && !btn.disabled) btn.click();
    return;
  }

  // Enter inside any other modal field (not a textarea) triggers the primary action
  if(e.key === 'Enter' && modalOpen && !inTextarea){
    const primaryBtn = document.querySelector('#modal-body .btn-primary, #modal-body .btn-gold');
    if(primaryBtn){ e.preventDefault(); primaryBtn.click(); }
    return;
  }

  // Exam view shortcuts
  if(location.hash === '#/exam' && currentExam && !inInput){
    const idx = currentExam._focusIdx || 0;
    const q = currentExam.questions[idx];
    if(['1','2','3','4','5','6'].includes(e.key) && q){
      const optIdx = parseInt(e.key)-1;
      if(optIdx < q.options.length){ e.preventDefault(); selectAnswer(idx, optIdx); }
      return;
    }
    if(e.key === 'ArrowRight' || e.key === 'Enter'){
      e.preventDefault();
      if(idx < currentExam.questions.length-1) examGo(idx+1); else confirmSubmitExam();
      return;
    }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); examGo(idx-1); return; }
  }
});

/* ============================= ANTI-CHEAT (light, exam view only) ============================= */
document.addEventListener('contextmenu', e=>{ if(location.hash==='#/exam') e.preventDefault(); });
document.addEventListener('copy', e=>{ if(location.hash==='#/exam') e.preventDefault(); });
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && location.hash==='#/exam') toast('⚠ ট্যাব পরিবর্তন শনাক্ত হয়েছে');
});

/* ============================= BOOT ============================= */
async function boot(){
  await loadDB();
  setTimeout(()=>{ document.getElementById('intro').classList.add('hide'); }, 2200);
  // Wait for Firebase to report the restored session (silent — no popup),
  // but never block longer than ~2.5s in case of a slow/offline network.
  await Promise.race([ authReadyPromise, new Promise(res=>setTimeout(res,2500)) ]);
  setTimeout(async ()=>{
    if(authResolvedUser && DB.profile){
      enterApp();
      if(currentExam && currentExam.status==='active'){
        if(examRemainingSecs()<=0){ await submitExam(true); }
        else { nav('exam'); }
      }
    } else {
      DB.profile = null;
      showLoginScreen();
    }
  }, 2300);
}
boot();
